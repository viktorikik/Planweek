            <div style="display:flex; gap:10px; flex-wrap:wrap;">
                <button class="btn-warning" onclick="acceptConflict()" style="flex:1;">✅ Принять конфликт</button>
                <button class="btn-secondary" onclick="rejectConflict()" style="flex:1;">✏️ Изменить время</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="analyticsModal">
        <div class="modal">
            <div class="modal-header">
                <h3>📊 Аналитика</h3>
                <button class="modal-close" onclick="closeAnalytics()">✕</button>
            </div>
            <label>Период с</label>
            <input type="date" id="analyticsStart" />
            <label>по</label>
            <input type="date" id="analyticsEnd" />
            <label>Участник</label>
            <select id="analyticsParticipant">
                <option value="all">Все</option>
            </select>
            <label>Название события (часть)</label>
            <input type="text" id="analyticsEventName" placeholder="Например: бассейн" />
            <button class="btn-primary" onclick="showAnalytics()" style="margin-top:12px;">Показать</button>
            <div class="analytics-result" id="analyticsResult"></div>
            <div class="chart-container" id="chartContainer">
                <canvas id="analyticsChart" width="400" height="300"></canvas>
                <div class="chart-legend" id="chartLegend"></div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="dayEventsModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="dayEventsTitle">События</h3>
                <button class="modal-close" onclick="closeDayEvents()">✕</button>
            </div>
            <div id="dayEventsList"></div>
        </div>
    </div>

    <div class="modal-overlay" id="deleteChoiceModal">
        <div class="modal">
            <div class="modal-header">
                <h3>🗑️ Удалить событие</h3>
                <button class="modal-close" onclick="closeDeleteChoice()">✕</button>
            </div>
            <p style="margin:16px 0; color:var(--text-primary);">Это событие повторяется. Что вы хотите сделать?</p>
            <div style="display:flex; flex-direction:column; gap:10px;">
                <button class="btn-primary" onclick="confirmDeleteSingle()" style="width:100%;">Удалить только это вхождение</button>
                <button class="btn-warning" onclick="confirmDeleteAll()" style="width:100%;">Удалить все повторения</button>
                <button class="btn-secondary" onclick="closeDeleteChoice()" style="width:100%;">Отмена</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        //   ПОЛНЫЙ JS-КОД (исправлен saveEvent)
        // ============================================================

        // ---------- ДАННЫЕ ----------
        const COLORS = ['#4F46E5','#7C3AED','#EC4899','#EF4444','#F59E0B','#10B981','#06B6D4'];

        function loadData() {
            const raw = localStorage.getItem('familyPlannerData');
            if (raw) {
                try { return JSON.parse(raw); } catch(e) {}
            }
            return { members: [], events: [] };
        }
        function saveData() {
            localStorage.setItem('familyPlannerData', JSON.stringify(data));
        }
        let data = loadData();

        let filterState = {};
        data.members.forEach(m => filterState[m.id] = true);
        let periodOffset = 0;
        let currentView = 'list';
        let currentTheme = 'auto';
        let pendingEvent = null;
        let currentEventMode = 'manual';
        let deleteTarget = null;

        function generateId() { return Date.now() + '_' + Math.random().toString(36).substr(2, 6); }
        function getMember(id) { return data.members.find(m => m.id === id); }
        function getMemberColor(id) { const m = getMember(id); return m ? m.color : '#94a3b8'; }
        function getMemberName(id) { const m = getMember(id); return m ? m.name : 'Неизвестный'; }

        // ---------- ДАТЫ ----------
        function getWeekRange(offset = 0) {
            const now = new Date();
            now.setDate(now.getDate() + offset * 7);
            const day = now.getDay();
            const diff = (day === 0 ? 6 : day - 1);
            const monday = new Date(now);
            monday.setDate(now.getDate() - diff);
            monday.setHours(0,0,0,0);
            const sunday = new Date(monday);
            sunday.setDate(monday.getDate() + 6);
            sunday.setHours(23,59,59,999);
            return { monday, sunday };
        }

        function getMonthRange(offset = 0) {
            const now = new Date();
            now.setMonth(now.getMonth() + offset);
            const first = new Date(now.getFullYear(), now.getMonth(), 1);
            const last = new Date(now.getFullYear(), now.getMonth() + 1, 0);
            return { first, last };
        }

        function getWeekDays(offset = 0) {
            const { monday } = getWeekRange(offset);
            const days = [];
            for (let i = 0; i < 7; i++) {
                const d = new Date(monday);
                d.setDate(monday.getDate() + i);
                days.push(d);
            }
            return days;
        }

        function formatDate(date) {
            return date.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
        }
        function formatDateFull(date) {
            return date.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
        }
        function formatTime(date) {
            return date.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
        }

        function toLocalDatetime(date) {
            const offset = date.getTimezoneOffset();
            const local = new Date(date.getTime() - offset * 60000);
            return local.toISOString().slice(0, 16);
        }

        function dateOnly(date) {
            return new Date(date.getFullYear(), date.getMonth(), date.getDate());
        }

        function toDateStr(date) {
            const d = dateOnly(date);
            return d.toISOString().slice(0,10);
        }

        // ---------- СТАТУСЫ ----------
        function getEffectiveStatus(event, dateStr) {
            if (event.statusExceptions && event.statusExceptions[dateStr]) {
                return event.statusExceptions[dateStr];
            }
            return event.status || 'completed';
        }

        // ---------- СОБЫТИЯ ----------
        function isEventOnDate(event, date) {
            const baseStart = new Date(event.start);
            const baseDate = dateOnly(baseStart);
            const target = dateOnly(date);
            if (event.exceptions && event.exceptions.includes(toDateStr(target))) {
                return false;
            }
            if (!event.recurrence || event.recurrence.type === 'none') {
                return baseDate.getTime() === target.getTime();
            }
            const rec = event.recurrence;
            const until = rec.until ? new Date(rec.until) : null;
            if (until && target > until) return false;
            if (target < baseDate) return false;
            const diffDays = Math.floor((target - baseDate) / (24*60*60*1000));
            switch (rec.type) {
                case 'daily': return diffDays % rec.interval === 0;
                case 'weekly': {
                    if (target.getDay() !== baseDate.getDay()) return false;
                    return diffDays % (7 * rec.interval) === 0;
                }
                case 'weekly_workdays': {
                    const day = target.getDay();
                    if (day === 0 || day === 6) return false;
                    return diffDays % rec.interval === 0;
                }
                case 'monthly': {
                    if (target.getDate() !== baseDate.getDate()) return false;
                    const monthDiff = (target.getFullYear() - baseDate.getFullYear()) * 12 + (target.getMonth() - baseDate.getMonth());
                    return monthDiff % rec.interval === 0 && monthDiff >= 0;
                }
                case 'custom': return diffDays % rec.interval === 0;
                case 'shift_2_2': return diffDays % 2 === 0;
                case 'shift_3': return diffDays % 3 === 0;
                default: return false;
            }
        }

        function getEventsForDate(date) {
            const result = [];
            data.events.forEach(ev => {
                if (isEventOnDate(ev, date)) {
                    const evCopy = { ...ev };
                    const start = new Date(ev.start);
                    const end = new Date(ev.end);
                    const newStart = new Date(date);
                    newStart.setHours(start.getHours(), start.getMinutes(), 0, 0);
                    const newEnd = new Date(date);
                    newEnd.setHours(end.getHours(), end.getMinutes(), 0, 0);
                    evCopy.start = newStart.toISOString();
                    evCopy.end = newEnd.toISOString();
                    result.push(evCopy);
                }
            });
            return result;
        }

        function getEventsForPeriod(startDate, endDate) {
            const result = [];
            const start = dateOnly(startDate);
            const end = dateOnly(endDate);
            let current = new Date(start);
            while (current <= end) {
                const events = getEventsForDate(current);
                events.forEach(ev => {
                    let evStart = new Date(ev.start);
                    let evEnd = new Date(ev.end);
                    if (evStart < startDate) evStart = startDate;
                    if (evEnd > endDate) evEnd = endDate;
                    if (evStart < evEnd) {
                        const copy = { ...ev, start: evStart.toISOString(), end: evEnd.toISOString() };
                        result.push(copy);
                    }
                });
                current.setDate(current.getDate() + 1);
            }
            return result;
        }

        function intervalsOverlap(s1, e1, s2, e2) {
            return s1 < e2 && s2 < e1;
        }

        function hasConflict(event, others) {
            if (event.allowOverlap) return false;
            const s1 = new Date(event.start).getTime();
            const e1 = new Date(event.end).getTime();
            for (let other of others) {
                if (other.id === event.id) continue;
                if (other.allowOverlap) continue;
                if (other.participantId === event.participantId) continue;
                const s2 = new Date(other.start).getTime();
                const e2 = new Date(other.end).getTime();
                if (intervalsOverlap(s1, e1, s2, e2)) return true;
            }
            return false;
        }

        // ---------- РЕНДЕРИНГ ----------
        function render() {
            updatePeriodLabel();
            renderFilters();
            if (currentView === 'list') renderList();
            else if (currentView === 'grid') renderGrid();
            else if (currentView === 'month') renderMonth();
        }

        function updatePeriodLabel() {
            const label = document.getElementById('periodLabel');
            if (currentView === 'month') {
                const { first } = getMonthRange(periodOffset);
                label.textContent = first.toLocaleDateString('ru-RU', { month: 'long', year: 'numeric' });
            } else {
                const { monday, sunday } = getWeekRange(periodOffset);
                label.textContent = `${formatDate(monday)} – ${formatDate(sunday)}`;
            }
        }

        function goToday() {
            periodOffset = 0;
            render();
        }

        function renderFilters() {
            const container = document.getElementById('filtersContainer');
            if (data.members.length === 0) {
                container.innerHTML = '<span style="color:var(--text-muted); font-size:14px;">Добавьте участников в настройках</span>';
                return;
            }
            let html = '';
            data.members.forEach(m => {
                const checked = filterState[m.id] !== false;
                html += `
                    <label class="filter-item">
                        <input type="checkbox" data-participant="${m.id}" ${checked ? 'checked' : ''} onchange="toggleFilter('${m.id}')" />
                        <span class="color-dot" style="background:${m.color}"></span>
                        ${m.name}
                    </label>
                `;
            });
            container.innerHTML = html;
        }

        function toggleFilter(id) {
            filterState[id] = !filterState[id];
            render();
        }

        function isFilteredOut(participantId) {
            return filterState[participantId] === false;
        }

        // ---------- СПИСОК ----------
        function renderList() {
            const container = document.getElementById('weekContainer');
            const days = getWeekDays(periodOffset);
            const eventsByDay = days.map(d => getEventsForDate(d));
            let html = `<div class="week-list">`;
            days.forEach((date, index) => {
                const dayEvents = eventsByDay[index]
                    .filter(ev => !isFilteredOut(ev.participantId))
                    .sort((a,b) => new Date(a.start) - new Date(b.start));
                html += `<div class="week-row">`;
                html += `<div class="date-col">${date.getDate()}</div>`;
                html += `<div class="day-col">${getDayName(index)}</div>`;
                html += `<div class="events-col">`;
                if (dayEvents.length === 0) {
                    html += `<span class="empty-events">Нет событий</span>`;
                } else {
                    dayEvents.forEach(ev => {
                        const participant = getMember(ev.participantId);
                        const color = participant ? participant.color : '#94a3b8';
                        const name = participant ? participant.name : 'Без участника';
                        const start = new Date(ev.start);
                        const end = new Date(ev.end);
                        const timeStr = formatTime(start) + ' – ' + formatTime(end);
                        const dateStr = toDateStr(date);
                        const status = getEffectiveStatus(ev, dateStr);
                        const statusIcon = status === 'completed' ? '✅' :
                                          status === 'postponed' ? '⏳' :
                                          status === 'cancelled' ? '❌' : '✅';
                        html += `
                            <div class="event-chip" style="border-left-color:${color};" onclick="editEvent('${ev.id}', '${dateStr}')">
                                <span class="status-icon">${statusIcon}</span>
                                <span class="dot" style="background:${color};"></span>
                                <span>${ev.name} (${timeStr})</span>
                                <span style="font-size:11px; color:var(--text-muted);">${name}</span>
                                <span class="chip-actions">
                                    <button class="delete-chip" onclick="event.stopPropagation(); deleteEvent('${ev.id}', '${dateStr}')" title="Удалить">✕</button>
                                </span>
                            </div>
                        `;
                    });
                }
                html += `</div></div>`;
            });
            html += `</div>`;
            container.innerHTML = html;
            initSwipe('list');
        }

        function getDayName(index) {
            return ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'][index];
        }

        // ---------- СЕТКА ----------
        function renderGrid() {
            const container = document.getElementById('weekContainer');
            const days = getWeekDays(periodOffset);
            const eventsByDay = days.map(d => getEventsForDate(d));
            const hourHeight = window.innerWidth <= 480 ? 24 : 32;
            const totalHeight = 24 * hourHeight;

            let html = `<div class="grid-wrapper"><div class="grid-scroll" id="gridScroll">`;
            days.forEach((date, index) => {
                const dayEvents = eventsByDay[index]
                    .filter(ev => !isFilteredOut(ev.participantId))
                    .sort((a,b) => new Date(a.start) - new Date(b.start));

                const eventsWithCols = assignColumns(dayEvents);

                html += `<div class="grid-day" data-day-index="${index}">`;
                html += `<div class="grid-day-header">${getDayName(index)}<br><span class="date">${formatDate(date)}</span></div>`;
                html += `<div class="grid-timeline" style="height:${totalHeight}px;" data-date="${toDateStr(date)}">`;

                for (let h = 0; h < 24; h++) {
                    const top = h * hourHeight;
                    const eventsInHour = dayEvents.filter(ev => {
                        const s = new Date(ev.start);
                        const e = new Date(ev.end);
                        const sHour = s.getHours() + s.getMinutes() / 60;
                        const eHour = e.getHours() + e.getMinutes() / 60;
                        return intervalsOverlap(sHour, eHour, h, h+1);
                    });
                    let hasRealConflict = false;
                    if (eventsInHour.length > 1) {
                        const hasUnresolved = eventsInHour.some(ev => !ev.allowOverlap);
                        if (hasUnresolved) hasRealConflict = true;
                    }
                    const conflictClass = hasRealConflict ? ' conflict' : '';
                    html += `<div class="grid-hour${conflictClass}" style="top:${top}px; height:${hourHeight}px;">${h}:00${hasRealConflict ? ' ⚠️' : ''}</div>`;
                }

                eventsWithCols.forEach(({ ev, colIndex, totalCols }) => {
                    const start = new Date(ev.start);
                    const end = new Date(ev.end);
                    const startHour = start.getHours() + start.getMinutes() / 60;
                    const endHour = end.getHours() + end.getMinutes() / 60;
                    const duration = endHour - startHour;
                    if (duration <= 0) return;
                    const top = startHour * hourHeight;
                    const height = duration * hourHeight;
                    const color = getMemberColor(ev.participantId);
                    const name = getMemberName(ev.participantId);
                    const isConflict = hasConflict(ev, dayEvents);
                    const conflictClass = isConflict ? ' conflict' : '';
                    const badge = isConflict ? '<span class="conflict-badge">⚠️</span>' : '';

                    const dateStr = toDateStr(date);
                    const status = getEffectiveStatus(ev, dateStr);
                    const statusIcon = status === 'completed' ? '✅' :
                                      status === 'postponed' ? '⏳' :
                                      status === 'cancelled' ? '❌' : '✅';

                    const colWidth = (1 / totalCols) * 100;
                    const leftOffset = colIndex * colWidth;
                    const innerWidth = colWidth - 0.5;

                    html += `
                        <div class="grid-event-block${conflictClass}" style="top:${top}px; height:${height}px; background:${color}; left:${leftOffset}%; width:${innerWidth}%;"
                             data-event-id="${ev.id}"
                             onclick="editEvent('${ev.id}', '${dateStr}')">
                            ${badge}
                            <span class="status-icon">${statusIcon}</span>
                            <strong>${ev.name}</strong>
                            <span class="time">${formatTime(start)} – ${formatTime(end)}</span>
                            <span class="participant">${name}</span>
                        </div>
                    `;
                });

                html += `</div></div>`;
            });
            html += `</div></div>`;
            container.innerHTML = html;
            const containerEl = document.getElementById('weekContainer');
            containerEl.removeEventListener('touchstart', onSwipeStart);
            containerEl.removeEventListener('touchmove', onSwipeMove);
            containerEl.removeEventListener('touchend', onSwipeEnd);
        }

        function assignColumns(events) {
            if (events.length === 0) return [];
            const sorted = [...events].sort((a,b) => new Date(a.start) - new Date(b.start));
            const columns = [];
            sorted.forEach((ev) => {
                const evStart = new Date(ev.start).getTime();
                const evEnd = new Date(ev.end).getTime();
                const usedCols = new Set();
                for (let i = 0; i < columns.length; i++) {
                    const other = columns[i];
                    const otherStart = new Date(other.start).getTime();
                    const otherEnd = new Date(other.end).getTime();
                    if (intervalsOverlap(evStart, evEnd, otherStart, otherEnd)) {
                        usedCols.add(other.col);
                    }
                }
                let col = 0;
                while (usedCols.has(col)) col++;
                ev.col = col;
                columns.push({ ...ev, col });
            });
            const totalCols = columns.reduce((max, e) => Math.max(max, e.col + 1), 0);
            return columns.map(ev => ({
                ev,
                colIndex: ev.col,
                totalCols: totalCols
            }));
        }

        // ---------- МЕСЯЦ ----------
        function renderMonth() {
            const container = document.getElementById('weekContainer');
            const { first, last } = getMonthRange(periodOffset);
            const start = new Date(first);
            start.setDate(1);
            let startDay = start.getDay();
            const offset = (startDay === 0 ? 6 : startDay - 1);
            start.setDate(start.getDate() - offset);

            const end = new Date(last);
            const totalDays = Math.ceil((end - start) / (24*60*60*1000)) + 1;

            let html = `<div class="weekdays">
                <span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span>
            </div><div class="days-grid">`;

            const today = dateOnly(new Date());

            for (let i = 0; i < totalDays; i++) {
                const date = new Date(start);
                date.setDate(start.getDate() + i);
                const isCurrentMonth = date.getMonth() === first.getMonth() && date.getFullYear() === first.getFullYear();
                const isToday = dateOnly(date).getTime() === today.getTime();
                const events = getEventsForDate(date).filter(ev => !isFilteredOut(ev.participantId));
                const colors = new Set();
                events.forEach(ev => {
                    const color = getMemberColor(ev.participantId);
                    if (color) colors.add(color);
                });

                let cls = 'day-cell';
                if (!isCurrentMonth) cls += ' other-month';
                if (isToday) cls += ' today';

                html += `<div class="${cls}" onclick="showDayEvents('${date.toISOString()}')">`;
                html += `<div class="day-number">${date.getDate()}</div>`;
                if (colors.size > 0) {
                    html += `<div class="day-dots">`;
                    colors.forEach(c => {
                        html += `<span class="dot" style="background:${c};"></span>`;
                    });
                    html += `</div>`;
                }
                html += `</div>`;
            }

            html += `</div>`;
            container.innerHTML = html;
            initSwipe('month');
        }

        // ---------- ПРОСМОТР ДНЯ ----------
        function showDayEvents(dateStr) {
            const date = new Date(dateStr);
            if (isNaN(date.getTime())) {
                alert('Ошибка даты');
                return;
            }
            const events = getEventsForDate(date).filter(ev => !isFilteredOut(ev.participantId));
            document.getElementById('dayEventsTitle').textContent = `События ${formatDateFull(date)}`;
            const list = document.getElementById('dayEventsList');
            if (events.length === 0) {
                list.innerHTML = '<div class="modal-empty">Нет событий</div>';
            } else {
                let html = '';
                events.sort((a,b) => new Date(a.start) - new Date(b.start)).forEach(ev => {
                    const participant = getMember(ev.participantId);
                    const color = participant ? participant.color : '#94a3b8';
                    const name = participant ? participant.name : 'Без участника';
                    const start = new Date(ev.start);
                    const end = new Date(ev.end);
                    const status = getEffectiveStatus(ev, toDateStr(date));
                    const statusIcon = status === 'completed' ? '✅' :
                                      status === 'postponed' ? '⏳' :
                                      status === 'cancelled' ? '❌' : '✅';
                    html += `
                        <div class="modal-dish" style="border-left-color:${color};" onclick="editEvent('${ev.id}', '${toDateStr(date)}'); closeDayEvents();">
                            <span class="dish-name">
                                <span class="status-badge">${statusIcon}</span>
                                <strong>${ev.name}</strong>
                                <span style="font-size:13px; color:var(--text-muted);">${formatTime(start)} – ${formatTime(end)}</span>
                                <span style="font-size:13px;">${name}</span>
                            </span>
                            <div class="dish-actions">
                                <button class="action-btn delete-btn" onclick="event.stopPropagation(); deleteEvent('${ev.id}', '${toDateStr(date)}'); closeDayEvents();" title="Удалить">✕</button>
                            </div>
                        </div>
                    `;
                });
                list.innerHTML = html;
            }
            openModal('dayEventsModal');
        }

        function closeDayEvents() { closeModal('dayEventsModal'); }

        // ---------- СВАЙП ----------
        let swipeStartX = 0, swipeStartY = 0, isSwiping = false;
        let swipeTarget = 'list';

        function initSwipe(mode) {
            const container = document.getElementById('weekContainer');
            container.removeEventListener('touchstart', onSwipeStart);
            container.removeEventListener('touchmove', onSwipeMove);
            container.removeEventListener('touchend', onSwipeEnd);
            if (mode === 'list' || mode === 'month') {
                swipeTarget = mode;
                container.addEventListener('touchstart', onSwipeStart, { passive: false });
                container.addEventListener('touchmove', onSwipeMove, { passive: false });
                container.addEventListener('touchend', onSwipeEnd, { passive: false });
            }
        }

        function onSwipeStart(e) {
            const touch = e.touches[0];
            swipeStartX = touch.clientX;
            swipeStartY = touch.clientY;
            isSwiping = false;
        }
        function onSwipeMove(e) {
            if (e.touches.length !== 1) return;
            const touch = e.touches[0];
            const dx = touch.clientX - swipeStartX;
            const dy = touch.clientY - swipeStartY;
            if (Math.abs(dx) > 30 && Math.abs(dx) > Math.abs(dy) * 1.2) {
                e.preventDefault();
                isSwiping = true;
            }
        }
        function onSwipeEnd(e) {
            if (!isSwiping) return;
            const touch = e.changedTouches[0];
            const dx = touch.clientX - swipeStartX;
            if (Math.abs(dx) > 50) {
                if (dx < 0) changePeriod(1);
                else changePeriod(-1);
            }
            isSwiping = false;
        }

        // ---------- НАВИГАЦИЯ ----------
        function changePeriod(delta) {
            periodOffset += delta;
            render();
        }

        // ---------- ПАРСЕР ТЕКСТА ----------
        function parseAndFillEvent() {
            const text = document.getElementById('eventTextInput').value.trim();
            if (!text) {
                alert('Введите описание события');
                return;
            }

            let parsed = parseEventText(text);
            if (!parsed) {
                alert('Не удалось распознать описание. Попробуйте изменить фразу.\nПример: "Ужин с Аней завтра в 19:00"');
                return;
            }

            if (parsed.name) document.getElementById('eventName').value = parsed.name;
            if (parsed.start) document.getElementById('eventStart').value = parsed.start;
            if (parsed.end) document.getElementById('eventEnd').value = parsed.end;
            if (parsed.participantId) {
                document.getElementById('eventParticipant').value = parsed.participantId;
            } else if (parsed.participantName) {
                const members = data.members;
                let found = members.find(m => m.name.toLowerCase() === parsed.participantName.toLowerCase());
                if (found) {
                    document.getElementById('eventParticipant').value = found.id;
                }
            }

            switchEventMode('manual');
            alert('Событие распознано! Проверьте и сохраните.');
        }

        function parseEventText(text) {
            text = text.replace(/\s+/g, ' ').trim();
            let result = { name: '', start: null, end: null, participantId: null, participantName: '' };

            let timeMatch = null;
            let timeRegex = /(?:в\s*)?(\d{1,2}):(\d{2})\s*(?:[уа])?/i;
            let match = text.match(timeRegex);
            if (match) {
                let hours = parseInt(match[1]);
                let minutes = parseInt(match[2]);
                if (hours < 24 && minutes < 60) {
                    timeMatch = { hours, minutes };
                    text = text.replace(match[0], '').trim();
                }
            } else {
                let eveningMatch = text.match(/в\s*(\d{1,2})\s*вечера/i);
                if (eveningMatch) {
                    let h = parseInt(eveningMatch[1]);
                    if (h >= 1 && h <= 12) h += 12;
                    if (h < 24) {
                        timeMatch = { hours: h, minutes: 0 };
                        text = text.replace(eveningMatch[0], '').trim();
                    }
                } else {
                    let morningMatch = text.match(/в\s*(\d{1,2})\s*утра/i);
                    if (morningMatch) {
                        let h = parseInt(morningMatch[1]);
                        if (h < 24) {
                            timeMatch = { hours: h, minutes: 0 };
                            text = text.replace(morningMatch[0], '').trim();
                        }
                    }
                }
            }

            let dateObj = null;
            let dateRegex = /(сегодня|завтра|послезавтра)/i;
            let dateMatch = text.match(dateRegex);
            if (dateMatch) {
                let keyword = dateMatch[0].toLowerCase();
                let now = new Date();
                let target = new Date(now);
                if (keyword === 'сегодня') { /* остаётся */ }
                else if (keyword === 'завтра') { target.setDate(now.getDate() + 1); }
                else if (keyword === 'послезавтра') { target.setDate(now.getDate() + 2); }
                dateObj = target;
                text = text.replace(dateMatch[0], '').trim();
            } else {
                let days = ['понедельник','вторник','среда','четверг','пятница','суббота','воскресенье'];
                let dayRegex = new RegExp('(?:в\\s*)?(' + days.join('|') + ')', 'i');
                let dayMatch = text.match(dayRegex);
                if (dayMatch) {
                    let dayName = dayMatch[1].toLowerCase();
                    let now = new Date();
                    let target = new Date(now);
                    let dayIndex = days.indexOf(dayName);
                    let currentDay = now.getDay();
                    let targetDay = (dayIndex === 0 ? 1 : dayIndex + 1);
                    let diff = targetDay - currentDay;
                    if (diff < 0) diff += 7;
                    if (diff === 0 && now.getHours() >= 12) diff = 7;
                    target.setDate(now.getDate() + diff);
                    dateObj = target;
                    text = text.replace(dayMatch[0], '').trim();
                } else {
                    let dateNumRegex = /(\d{1,2})\s*(?:мая|июня|июля|августа|сентября|октября|ноября|декабря|января|февраля|марта|апреля)/i;
                    let dateNumMatch = text.match(dateNumRegex);
                    if (dateNumMatch) {
                        let day = parseInt(dateNumMatch[1]);
                        let monthNames = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
                        let monthStr = dateNumMatch[2].toLowerCase();
                        let monthIndex = monthNames.indexOf(monthStr);
                        if (monthIndex !== -1) {
                            let now = new Date();
                            let year = now.getFullYear();
                            let target = new Date(year, monthIndex, day);
                            if (target < now) {
                                target.setFullYear(year + 1);
                            }
                            dateObj = target;
                            text = text.replace(dateNumMatch[0], '').trim();
                        }
                    } else {
                        let dotMatch = text.match(/(\d{1,2})[\/\.](\d{1,2})/);
                        if (dotMatch) {
                            let day = parseInt(dotMatch[1]);
                            let month = parseInt(dotMatch[2]) - 1;
                            let now = new Date();
                            let year = now.getFullYear();
                            let target = new Date(year, month, day);
                            if (target < now) {
                                target.setFullYear(year + 1);
                            }
                            dateObj = target;
                            text = text.replace(dotMatch[0], '').trim();
                        }
                    }
                }
            }

            let participantName = '';
            let participantMatch = text.match(/(?:с|со)\s+([А-Яа-яЁё]+)/i);
            if (participantMatch) {
                participantName = participantMatch[1];
                text = text.replace(participantMatch[0], '').trim();
            }

            let name = text.trim();
            if (!name) name = 'Событие';

            let now = new Date();
            let startDate = dateObj ? new Date(dateObj) : new Date(now);
            if (timeMatch) {
                startDate.setHours(timeMatch.hours, timeMatch.minutes, 0, 0);
            } else {
                startDate.setHours(now.getHours() + 1, 0, 0, 0);
            }
            let endDate = new Date(startDate);
            endDate.setHours(startDate.getHours() + 1);

            result.name = name;
            result.start = toLocalDatetime(startDate);
            result.end = toLocalDatetime(endDate);
            result.participantName = participantName;

            return result;
        }

        // ---------- РЕЖИМЫ ВВОДА ----------
        function switchEventMode(mode) {
            currentEventMode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.mode === mode);
            });
            document.getElementById('manualFields').style.display = (mode === 'manual') ? 'block' : 'none';
            document.getElementById('textFields').style.display = (mode === 'text') ? 'block' : 'none';
        }

        // ---------- СОБЫТИЯ (CRUD) ----------
        function openAddEvent() {
            document.getElementById('eventModalTitle').textContent = '➕ Новое событие';
            document.getElementById('editingEventId').value = '';
            document.getElementById('saveEventBtn').textContent = 'Сохранить';
            document.getElementById('eventName').value = '';
            document.getElementById('eventNotes').value = '';
            document.getElementById('eventTextInput').value = '';
            const now = new Date();
            document.getElementById('eventStart').value = toLocalDatetime(now);
            const end = new Date(now);
            end.setHours(now.getHours() + 1);
            document.getElementById('eventEnd').value = toLocalDatetime(end);
            document.getElementById('recurrenceType').value = 'none';
            document.getElementById('recurrenceInterval').value = 1;
            document.getElementById('recurrenceUntil').value = '';
            document.getElementById('allowOverlap').checked = false;
            document.getElementById('eventStatus').value = 'completed';
            document.getElementById('editingDateStr').value = '';
            document.getElementById('onlyThisDay').style.display = 'none';
            populateParticipantSelect();
            switchEventMode('manual');
            openModal('eventModal');
        }

        function editEvent(eventId, dateStr) {
            const ev = data.events.find(e => e.id === eventId);
            if (!ev) return;
            document.getElementById('eventModalTitle').textContent = '✎ Редактировать событие';
            document.getElementById('editingEventId').value = eventId;
            document.getElementById('saveEventBtn').textContent = 'Обновить';
            document.getElementById('eventTextInput').value = '';

            document.getElementById('editingDateStr').value = dateStr || '';

            const start = new Date(ev.start);
            const end = new Date(ev.end);
            document.getElementById('eventName').value = ev.name;
            document.getElementById('eventNotes').value = ev.notes || '';
            document.getElementById('allowOverlap').checked = ev.allowOverlap || false;

            let currentStatus = ev.status || 'completed';
            if (dateStr && ev.statusExceptions && ev.statusExceptions[dateStr]) {
                currentStatus = ev.statusExceptions[dateStr];
            }
            document.getElementById('eventStatus').value = currentStatus;

            const isRecurring = ev.recurrence && ev.recurrence.type !== 'none';
            const onlyThisDayCheck = document.getElementById('onlyThisDay');
            if (isRecurring && dateStr) {
                onlyThisDayCheck.style.display = 'flex';
                onlyThisDayCheck.querySelector('input').checked = !!(ev.statusExceptions && ev.statusExceptions[dateStr]);
            } else {
                onlyThisDayCheck.style.display = 'none';
                onlyThisDayCheck.querySelector('input').checked = false;
            }

            document.getElementById('eventStart').value = toLocalDatetime(start);
            document.getElementById('eventEnd').value = toLocalDatetime(end);

            if (ev.recurrence) {
                document.getElementById('recurrenceType').value = ev.recurrence.type;
                document.getElementById('recurrenceInterval').value = ev.recurrence.interval || 1;
                document.getElementById('recurrenceUntil').value = ev.recurrence.until ? new Date(ev.recurrence.until).toISOString().slice(0, 10) : '';
            } else {
                document.getElementById('recurrenceType').value = 'none';
                document.getElementById('recurrenceInterval').value = 1;
                document.getElementById('recurrenceUntil').value = '';
            }
            populateParticipantSelect();
            document.getElementById('eventParticipant').value = ev.participantId;
            switchEventMode('manual');
            openModal('eventModal');
        }

        function populateParticipantSelect() {
            const select = document.getElementById('eventParticipant');
            select.innerHTML = '';
            if (data.members.length === 0) {
                select.innerHTML = '<option value="">Сначала добавьте участников</option>';
            } else {
                data.members.forEach(m => {
                    const opt = document.createElement('option');
                    opt.value = m.id;
                    opt.textContent = m.name;
                    select.appendChild(opt);
                });
            }
        }

        // ============================================================
        //   ГЛАВНОЕ ИСПРАВЛЕНИЕ – ФУНКЦИЯ saveEvent
        // ============================================================
        function saveEvent() {
            const id = document.getElementById('editingEventId').value;
            const dateStr = document.getElementById('editingDateStr').value;
            const name = document.getElementById('eventName').value.trim();
            let start = document.getElementById('eventStart').value;
            let end = document.getElementById('eventEnd').value;
            const participantId = document.getElementById('eventParticipant').value;
            const recType = document.getElementById('recurrenceType').value;
            const recInterval = parseInt(document.getElementById('recurrenceInterval').value) || 1;
            const recUntil = document.getElementById('recurrenceUntil').value;
            const allowOverlap = document.getElementById('allowOverlap').checked;
            const notes = document.getElementById('eventNotes').value.trim();
            const status = document.getElementById('eventStatus').value;
            const onlyThisDay = document.getElementById('onlyThisDayCheck').checked;

            if (!name || !start || !end || !participantId) {
                alert('Заполните все поля!');
                return;
            }
            if (new Date(start) >= new Date(end)) {
                alert('Время окончания должно быть позже времени начала.');
                return;
            }

            let finalRecType = recType;
            let finalInterval = recInterval;
            if (recType === 'shift_2_2') {
                finalRecType = 'daily';
                finalInterval = 2;
            } else if (recType === 'shift_3') {
                finalRecType = 'daily';
                finalInterval = 3;
            }
            const recurrence = { type: finalRecType, interval: finalInterval, until: recUntil || null };

            let eventObj;
            if (id) {
                const ev = data.events.find(e => e.id === id);
                if (!ev) return;
                ev.name = name;
                ev.start = start;
                ev.end = end;
                ev.participantId = participantId;
                ev.recurrence = recurrence;
                ev.allowOverlap = allowOverlap;
                ev.notes = notes;

                if (onlyThisDay && dateStr) {
                    // Сохраняем статус только для этого дня
                    if (!ev.statusExceptions) ev.statusExceptions = {};
                    ev.statusExceptions[dateStr] = status;
                    // Общий статус не меняем
                } else {
                    // Применяем ко всем дням – обновляем общий статус и удаляем все исключения
                    ev.status = status;
                    ev.statusExceptions = {}; // удаляем все переопределения
                }
                eventObj = ev;
            } else {
                eventObj = {
                    id: generateId(),
                    name,
                    start,
                    end,
                    participantId,
                    recurrence,
                    allowOverlap,
                    notes,
                    status,
                    exceptions: [],
                    statusExceptions: {}
                };
            }

            const others = data.events.filter(e => e.id !== eventObj.id);
            const hasConflictWithOthers = hasConflict(eventObj, others);
            if (hasConflictWithOthers && !eventObj.allowOverlap) {
                pendingEvent = eventObj;
                document.getElementById('conflictMessage').textContent =
                    `Событие "${eventObj.name}" пересекается с другими событиями. Вы можете принять конфликт (тогда оно будет отображаться без предупреждений) или изменить время.`;
                openModal('conflictModal');
                return;
            }

            if (id) {
                // уже обновили
            } else {
                data.events.push(eventObj);
            }
            saveData();
            closeModal('eventModal');
            render();
        }

        function acceptConflict() {
            if (pendingEvent) {
                pendingEvent.allowOverlap = true;
                if (!data.events.find(e => e.id === pendingEvent.id)) {
                    data.events.push(pendingEvent);
                }
                saveData();
                closeModal('conflictModal');
                pendingEvent = null;
                closeModal('eventModal');
                render();
            }
        }
        function rejectConflict() { closeModal('conflictModal'); pendingEvent = null; }

        // ---------- УДАЛЕНИЕ ----------
        function deleteEvent(eventId, dateStr) {
            const ev = data.events.find(e => e.id === eventId);
            if (!ev) return;
            const isRecurring = ev.recurrence && ev.recurrence.type !== 'none';
            if (isRecurring) {
                deleteTarget = { eventId, dateStr };
                openModal('deleteChoiceModal');
            } else {
                if (!confirm('Удалить событие?')) return;
                data.events = data.events.filter(e => e.id !== eventId);
                saveData();
                render();
            }
        }

        function closeDeleteChoice() {
            closeModal('deleteChoiceModal');
            deleteTarget = null;
        }

        function confirmDeleteSingle() {
            if (!deleteTarget) return;
            const { eventId, dateStr } = deleteTarget;
            const ev = data.events.find(e => e.id === eventId);
            if (ev) {
                if (!ev.exceptions) ev.exceptions = [];
                if (!ev.exceptions.includes(dateStr)) {
                    ev.exceptions.push(dateStr);
                    saveData();
                    render();
                }
            }
            closeDeleteChoice();
        }

        function confirmDeleteAll() {
            if (!deleteTarget) return;
            const { eventId } = deleteTarget;
            data.events = data.events.filter(e => e.id !== eventId);
            saveData();
            render();
            closeDeleteChoice();
        }

        // ---------- НАСТРОЙКИ СЕМЬИ ----------
        let selectedColor = COLORS[0];
        function openSettings() {
            openModal('settingsModal');
            renderMembers();
            renderColorOptions();
        }
        function closeSettings() { closeModal('settingsModal'); }

        function renderMembers() {
            const container = document.getElementById('memberList');
            if (data.members.length === 0) {
                container.innerHTML = '<div class="modal-empty">Пока нет участников. Добавьте первого!</div>';
                return;
            }
            let html = '';
            data.members.forEach(m => {
                html += `
                    <div class="member-row">
                        <span class="color-dot" style="background:${m.color}"></span>
                        <span>${m.name}</span>
                        <button onclick="removeMember('${m.id}')">✕</button>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function renderColorOptions() {
            const container = document.getElementById('colorSelect');
            container.innerHTML = '';
            COLORS.forEach(c => {
                const div = document.createElement('div');
                div.className = 'color-option' + (c === selectedColor ? ' selected' : '');
                div.style.background = c;
                div.dataset.color = c;
                div.onclick = function() {
                    document.querySelectorAll('.color-option').forEach(el => el.classList.remove('selected'));
                    this.classList.add('selected');
                    selectedColor = this.dataset.color;
                };
                container.appendChild(div);
            });
        }

        function addMember() {
            const input = document.getElementById('newMemberName');
            const name = input.value.trim();
            if (!name) { alert('Введите имя'); return; }
            if (data.members.some(m => m.name.toLowerCase() === name.toLowerCase())) {
                alert('Участник с таким именем уже есть');
                return;
            }
            data.members.push({ id: generateId(), name, color: selectedColor });
            saveData();
            input.value = '';
            selectedColor = COLORS[0];
            renderColorOptions();
            renderMembers();
            filterState[data.members[data.members.length-1].id] = true;
            render();
        }

        function removeMember(id) {
            if (!confirm('Удалить участника?')) return;
            data.members = data.members.filter(m => m.id !== id);
            delete filterState[id];
            saveData();
            renderMembers();
            render();
        }

        // ---------- АНАЛИТИКА ----------
        function openAnalytics() {
            const select = document.getElementById('analyticsParticipant');
            select.innerHTML = '<option value="all">Все</option>';
            data.members.forEach(m => {
                const opt = document.createElement('option');
                opt.value = m.id;
                opt.textContent = m.name;
                select.appendChild(opt);
            });
            const end = new Date();
            const start = new Date();
            start.setDate(start.getDate() - 30);
            document.getElementById('analyticsStart').value = start.toISOString().slice(0,10);
            document.getElementById('analyticsEnd').value = end.toISOString().slice(0,10);
            document.getElementById('analyticsEventName').value = '';
            document.getElementById('analyticsResult').innerHTML = '';
            const canvas = document.getElementById('analyticsChart');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            document.getElementById('chartLegend').innerHTML = '';
            openModal('analyticsModal');
        }

        function closeAnalytics() { closeModal('analyticsModal'); }

        function showAnalytics() {
            const startStr = document.getElementById('analyticsStart').value;
            const endStr = document.getElementById('analyticsEnd').value;
            const participantId = document.getElementById('analyticsParticipant').value;
            const eventNameFilter = document.getElementById('analyticsEventName').value.trim().toLowerCase();

            if (!startStr || !endStr) {
                alert('Выберите период');
                return;
            }
            const start = new Date(startStr);
            const end = new Date(endStr);
            end.setHours(23,59,59,999);
            if (start > end) {
                alert('Дата начала не может быть позже даты окончания');
                return;
            }

            let events = getEventsForPeriod(start, end);
            if (participantId !== 'all') {
                events = events.filter(ev => ev.participantId === participantId);
            }
            if (eventNameFilter) {
                events = events.filter(ev => ev.name.toLowerCase().includes(eventNameFilter));
            }

            const groups = {};
            events.forEach(ev => {
                const key = ev.name;
                if (!groups[key]) groups[key] = 0;
                const duration = (new Date(ev.end) - new Date(ev.start)) / (1000 * 60 * 60);
                groups[key] += duration;
            });

            const resultDiv = document.getElementById('analyticsResult');
            if (Object.keys(groups).length === 0) {
                resultDiv.innerHTML = '<div class="modal-empty">Нет данных за выбранный период</div>';
                const canvas = document.getElementById('analyticsChart');
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                document.getElementById('chartLegend').innerHTML = '';
                return;
            }

            const sorted = Object.entries(groups).sort((a,b) => b[1] - a[1]);
            let tableHtml = `<table class="analytics-table"><tr><th>Событие</th><th>Время</th><th>Количество</th></tr>`;
            sorted.forEach(([name, hours]) => {
                const h = Math.floor(hours);
                const m = Math.round((hours - h) * 60);
                const count = events.filter(e => e.name === name).length;
                tableHtml += `<tr><td>${name}</td><td>${h} ч ${m} мин</td><td>${count}</td></tr>`;
            });
            tableHtml += `</table>`;
            resultDiv.innerHTML = tableHtml;

            drawModernPieChart(sorted);
        }

        function drawModernPieChart(data) {
            const canvas = document.getElementById('analyticsChart');
            const ctx = canvas.getContext('2d');
            const width = canvas.width;
            const height = canvas.height;
            const dpr = window.devicePixelRatio || 1;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
            ctx.clearRect(0, 0, width, height);

            const total = data.reduce((sum, [, val]) => sum + val, 0);
            if (total === 0) return;

            const pieColors = [
                '#FF6B6B', '#4ECDC4', '#45B7D1', '#FFA07A', '#98D8C8',
                '#F7DC6F', '#BB8FCE', '#85C1E9', '#F8C471', '#82E0AA'
            ];

            const centerX = width / 2;
            const centerY = height / 2;
            const radius = Math.min(width, height) / 2 - 30;
            const shadowBlur = 8;
            let startAngle = -Math.PI / 2;

            const legendData = [];

            data.forEach(([name, value], index) => {
                const sliceAngle = (value / total) * 2 * Math.PI;
                const color = pieColors[index % pieColors.length];
                const endAngle = startAngle + sliceAngle;

                ctx.shadowColor = 'rgba(0,0,0,0.1)';
                ctx.shadowBlur = shadowBlur;
                ctx.shadowOffsetX = 2;
                ctx.shadowOffsetY = 2;

                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, startAngle, endAngle);
                ctx.closePath();
                ctx.fillStyle = color;
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 2;
                ctx.stroke();

                const midAngle = startAngle + sliceAngle / 2;
                const labelRadius = radius * 0.65;
                const labelX = centerX + Math.cos(midAngle) * labelRadius;
                const labelY = centerY + Math.sin(midAngle) * labelRadius;
                const percent = ((value / total) * 100).toFixed(1);
                ctx.fillStyle = 'white';
                ctx.font = 'bold 13px system-ui, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowBlur = 0;
                ctx.fillText(percent + '%', labelX, labelY);

                legendData.push({ name, color, percent });
                startAngle = endAngle;
            });

            const legendContainer = document.getElementById('chartLegend');
            let legendHtml = '';
            legendData.forEach(item => {
                legendHtml += `
                    <div class="legend-item">
                        <span class="legend-color" style="background:${item.color};"></span>
                        <span class="legend-label">
                            <span>${item.name}</span>
                            <span class="legend-percent">${item.percent}%</span>
                        </span>
                    </div>
                `;
            });
            legendContainer.innerHTML = legendHtml;
        }

        // ---------- МОДАЛКИ ----------
        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }
        function closeEvent() { closeModal('eventModal'); }

        // ---------- ТЕМА ----------
        function applyTheme(theme) {
            const body = document.body;
            if (theme === 'dark') {
                body.classList.add('dark-theme');
                document.querySelector('.theme-toggle').textContent = '☀️';
            } else if (theme === 'light') {
                body.classList.remove('dark-theme');
                document.querySelector('.theme-toggle').textContent = '🌙';
            } else {
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (prefersDark) {
                    body.classList.add('dark-theme');
                    document.querySelector('.theme-toggle').textContent = '☀️';
                } else {
                    body.classList.remove('dark-theme');
                    document.querySelector('.theme-toggle').textContent = '🌙';
                }
            }
            currentTheme = theme;
            localStorage.setItem('themePreference', theme);
        }
        function toggleTheme() {
            if (currentTheme === 'light') applyTheme('dark');
            else if (currentTheme === 'dark') applyTheme('light');
            else {
                const isDark = document.body.classList.contains('dark-theme');
                applyTheme(isDark ? 'light' : 'dark');
            }
        }
        function initTheme() {
            const saved = localStorage.getItem('themePreference');
            if (saved) applyTheme(saved);
            else applyTheme('auto');
            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
                if (currentTheme === 'auto') applyTheme('auto');
            });
        }

        // ---------- ПЕРЕКЛЮЧЕНИЕ РЕЖИМОВ ----------
        function setView(view) {
            currentView = view;
            document.querySelectorAll('.view-toggle button').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.view === view);
            });
            render();
        }

        // ---------- ИНИЦИАЛИЗАЦИЯ ----------
        initTheme();
        render();
    </script>
