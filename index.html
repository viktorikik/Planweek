<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Семейный планировщик</title>
    <style>
        /* ----- CSS-переменные для светлой/тёмной темы ----- */
        :root {
            --bg: #f4f6f9;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-secondary: #475569;
            --border: #e2e8f0;
            --shadow: 0 2px 8px rgba(0,0,0,0.04);
            --filter-bg: #ffffff;
            --switch-bg: #e9edf3;
            --switch-active: #ffffff;
            --day-bg: #ffffff;
            --grid-bg: #f8fafc;
            --grid-cell: #ffffff;
            --hour-line: #eef2f6;
            --conflict-bg: #fee2e2;   /* фон часа с конфликтом */
            --fab-bg: #2563eb;
            --fab-text: #ffffff;
        }
        body.dark {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f1f5f9;
            --text-secondary: #94a3b8;
            --border: #334155;
            --shadow: 0 2px 8px rgba(0,0,0,0.3);
            --filter-bg: #1e293b;
            --switch-bg: #334155;
            --switch-active: #0f172a;
            --day-bg: #1e293b;
            --grid-bg: #1e293b;
            --grid-cell: #1e293b;
            --hour-line: #334155;
            --conflict-bg: #7f1d1d;
            --fab-bg: #3b82f6;
            --fab-text: #ffffff;
        }

        /* ----- Глобальные стили ----- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 16px 12px 80px 12px;
            transition: background 0.2s, color 0.2s;
        }
        h1 {
            font-size: 24px;
            font-weight: 600;
            text-align: center;
            margin: 0 0 12px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .header-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-bottom: 10px;
            align-items: center;
        }
        .header-actions button {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 30px;
            transition: background 0.2s;
            color: var(--text);
        }
        .header-actions button:hover {
            background: var(--border);
        }
        .theme-toggle {
            font-size: 24px;
        }

        /* ----- Навигация по неделям ----- */
        .week-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            background: var(--card-bg);
            padding: 8px 16px;
            border-radius: 40px;
            box-shadow: var(--shadow);
        }
        .week-nav .week-label {
            font-weight: 500;
            font-size: 16px;
        }
        .week-nav button {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--text);
            padding: 0 8px;
            transition: 0.2s;
        }
        .week-nav button:hover {
            color: var(--fab-bg);
        }

        /* ----- Фильтры (участники) ----- */
        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 14px;
            background: var(--filter-bg);
            padding: 12px 16px;
            border-radius: 40px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
            justify-content: center;
            transition: background 0.2s;
        }
        .filter-item {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 14px;
            cursor: pointer;
            color: var(--text);
        }
        .filter-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: currentColor;
            cursor: pointer;
        }
        .color-dot {
            display: inline-block;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 1px solid rgba(0,0,0,0.1);
            flex-shrink: 0;
        }

        /* ----- Переключатель режимов ----- */
        .view-switch {
            display: flex;
            justify-content: center;
            gap: 6px;
            background: var(--switch-bg);
            border-radius: 40px;
            padding: 4px;
            margin-bottom: 16px;
            transition: background 0.2s;
        }
        .view-switch button {
            flex: 1;
            max-width: 120px;
            padding: 8px 12px;
            border: none;
            border-radius: 30px;
            background: transparent;
            font-weight: 500;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
            color: var(--text-secondary);
        }
        .view-switch button.active {
            background: var(--switch-active);
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            color: var(--text);
        }

        /* ----- Контейнер недели ----- */
        .week-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* ----- РЕЖИМ "СПИСОК" ----- */
        .day-list {
            background: var(--day-bg);
            border-radius: 20px;
            padding: 12px 16px;
            box-shadow: var(--shadow);
            transition: background 0.2s;
        }
        .day-header {
            font-weight: 600;
            font-size: 18px;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
            margin-bottom: 8px;
            color: var(--text);
        }
        .day-header .date {
            font-weight: 400;
            color: var(--text-secondary);
            font-size: 14px;
        }
        .event-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
            color: var(--text);
        }
        .event-item:last-child {
            border-bottom: none;
        }
        .event-time {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            min-width: 80px;
        }
        .event-name {
            flex: 1;
            font-size: 15px;
        }
        .event-participant {
            font-size: 13px;
            padding: 2px 12px;
            border-radius: 30px;
            background: var(--border);
            white-space: nowrap;
            color: var(--text);
        }
        .event-participant .dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 4px;
        }
        .empty-day {
            color: var(--text-secondary);
            font-size: 14px;
            padding: 6px 0;
            text-align: center;
        }
        .event-actions button {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            color: var(--text-secondary);
            padding: 0 4px;
            transition: 0.2s;
        }
        .event-actions button:hover {
            color: var(--fab-bg);
        }
        .event-actions .delete-event:hover {
            color: #ef4444;
        }

        /* ----- РЕЖИМ "СЕТКА" ----- */
        .grid-wrapper {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin: 0 -12px;
            padding: 0 12px;
        }
        .grid-scroll {
            display: flex;
            gap: 4px;
            min-width: 700px;
        }
        .grid-day {
            flex: 1;
            min-width: 80px;
            position: relative;
            background: var(--grid-bg);
            border-radius: 12px;
            padding: 0 4px 4px 4px;
            transition: background 0.2s;
        }
        .grid-day-header {
            text-align: center;
            font-weight: 600;
            padding: 8px 0;
            background: var(--card-bg);
            border-radius: 12px 12px 0 0;
            color: var(--text);
        }
        .grid-day-header .date {
            font-weight: 400;
            font-size: 12px;
            color: var(--text-secondary);
        }
        .grid-timeline {
            position: relative;
            height: 768px; /* 24ч * 32px */
            background: var(--grid-cell);
            border-radius: 0 0 12px 12px;
            overflow: hidden;
            transition: background 0.2s;
        }
        .grid-hour {
            position: absolute;
            left: 0;
            right: 0;
            border-top: 1px solid var(--hour-line);
            height: 32px;
            display: flex;
            align-items: center;
            padding-left: 4px;
            font-size: 10px;
            color: var(--text-secondary);
            transition: background 0.2s;
        }
        .grid-hour.conflict {
            background: var(--conflict-bg) !important;
        }
        .grid-event-block {
            position: absolute;
            left: 4px;
            right: 4px;
            border-radius: 6px;
            padding: 2px 6px;
            color: white;
            font-size: 11px;
            overflow: hidden;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            justify-content: center;
            cursor: default;
            z-index: 5;
            transition: all 0.1s;
        }
        .grid-event-block strong {
            font-size: 11px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .grid-event-block .time {
            font-size: 9px;
            opacity: 0.9;
        }
        .grid-event-block .participant {
            font-size: 9px;
            opacity: 0.8;
        }

        /* ----- Модальное окно ----- */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(2px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal {
            background: var(--card-bg);
            border-radius: 28px;
            max-width: 450px;
            width: 100%;
            padding: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            max-height: 90vh;
            overflow-y: auto;
            color: var(--text);
            transition: background 0.2s, color 0.2s;
        }
        .modal h2 {
            font-size: 22px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal h2 button {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: var(--text-secondary);
        }
        .modal label {
            display: block;
            font-weight: 500;
            margin: 12px 0 4px;
            font-size: 14px;
        }
        .modal input[type="text"],
        .modal input[type="datetime-local"],
        .modal select {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 40px;
            font-size: 16px;
            margin-bottom: 8px;
            background: var(--card-bg);
            color: var(--text);
            transition: background 0.2s, color 0.2s;
        }
        .modal .color-select {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        .modal .color-option {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 3px solid transparent;
            cursor: pointer;
            transition: 0.2s;
        }
        .modal .color-option.selected {
            border-color: var(--text);
            transform: scale(1.1);
        }
        .modal .member-list {
            margin: 16px 0;
        }
        .modal .member-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
        }
        .modal .member-row .color-dot {
            width: 24px;
            height: 24px;
            border-radius: 50%;
        }
        .modal .member-row span {
            flex: 1;
        }
        .modal .member-row button {
            background: none;
            border: none;
            color: #ef4444;
            font-size: 18px;
            cursor: pointer;
        }
        .modal .recurrence-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            margin-bottom: 8px;
        }
        .modal .recurrence-group select,
        .modal .recurrence-group input {
            flex: 1;
            min-width: 80px;
        }
        .btn-primary {
            background: var(--fab-bg);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 40px;
            font-size: 16px;
            font-weight: 500;
            width: 100%;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-primary:hover {
            opacity: 0.9;
        }
        .btn-secondary {
            background: var(--border);
            color: var(--text);
            border: none;
            padding: 10px 20px;
            border-radius: 40px;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-secondary:hover {
            opacity: 0.8;
        }

        /* ----- Плавающая кнопка ----- */
        .fab {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: var(--fab-bg);
            color: var(--fab-text);
            border: none;
            font-size: 36px;
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.35);
            cursor: pointer;
            transition: 0.2s;
            z-index: 500;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .fab:hover {
            transform: scale(1.05);
        }

        /* ----- Адаптив ----- */
        @media (max-width: 480px) {
            body { padding: 12px 8px 80px 8px; }
            .filters { padding: 8px 12px; gap: 4px 10px; }
            .filter-item { font-size: 13px; }
            .view-switch button { font-size: 14px; padding: 6px 10px; }
            .day-header { font-size: 16px; }
            .event-time { min-width: 60px; font-size: 12px; }
            .event-name { font-size: 14px; }
            .modal { padding: 16px; }
            .grid-scroll { min-width: 480px; }
            .grid-timeline { height: 576px; } /* 24*24px для экономии места */
            .grid-hour { height: 24px; }
            .grid-event-block { font-size: 10px; }
        }
    </style>
</head>
<body>
    <h1>
        📅 Семейный план
        <button class="theme-toggle" onclick="toggleTheme()" title="Сменить тему">🌙</button>
    </h1>

    <div class="header-actions">
        <button onclick="openSettings()" title="Настроить семью">⚙️</button>
    </div>

    <!-- Навигация по неделям -->
    <div class="week-nav">
        <button onclick="changeWeek(-1)">◀</button>
        <span class="week-label" id="weekLabel">Неделя</span>
        <button onclick="changeWeek(1)">▶</button>
    </div>

    <!-- Фильтр по участникам -->
    <div class="filters" id="filtersContainer"></div>

    <!-- Переключатель режимов -->
    <div class="view-switch">
        <button class="active" data-view="list" onclick="setView('list')">📋 Список</button>
        <button data-view="grid" onclick="setView('grid')">📊 Сетка</button>
    </div>

    <!-- Контейнер недели -->
    <div class="week-container" id="weekContainer"></div>

    <!-- Плавающая кнопка "Добавить событие" -->
    <button class="fab" onclick="openAddEvent()">＋</button>

    <!-- Модальное окно настроек (участники) -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal">
            <h2>
                👨‍👩‍👧‍👦 Семья
                <button onclick="closeSettings()">✕</button>
            </h2>
            <div class="member-list" id="memberList"></div>
            <label>Добавить участника</label>
            <div style="display:flex; gap:8px; flex-wrap:wrap;">
                <input type="text" id="newMemberName" placeholder="Имя" style="flex:1; padding:10px 14px; border:1px solid var(--border); border-radius:40px; background:var(--card-bg); color:var(--text);" />
                <div class="color-select" id="colorSelect"></div>
            </div>
            <button class="btn-primary" onclick="addMember()" style="margin-top:12px;">➕ Добавить</button>
            <button class="btn-secondary" onclick="closeSettings()" style="margin-top:8px;">Закрыть</button>
        </div>
    </div>

    <!-- Модальное окно добавления/редактирования события -->
    <div class="modal-overlay" id="eventModal">
        <div class="modal">
            <h2>
                <span id="eventModalTitle">➕ Новое событие</span>
                <button onclick="closeEvent()">✕</button>
            </h2>
            <label>Название</label>
            <input type="text" id="eventName" placeholder="Например: Футбол" />

            <label>Начало</label>
            <input type="datetime-local" id="eventStart" />

            <label>Окончание</label>
            <input type="datetime-local" id="eventEnd" />

            <label>Участник</label>
            <select id="eventParticipant" style="width:100%; padding:10px 14px; border-radius:40px; border:1px solid var(--border); background:var(--card-bg); color:var(--text);"></select>

            <label>Повторение</label>
            <div class="recurrence-group">
                <select id="recurrenceType">
                    <option value="none">Нет</option>
                    <option value="daily">Ежедневно</option>
                    <option value="weekly">Еженедельно</option>
                    <option value="monthly">Ежемесячно</option>
                    <option value="custom">Каждые N дней</option>
                </select>
                <input type="number" id="recurrenceInterval" value="1" min="1" style="width:70px; padding:8px; border:1px solid var(--border); border-radius:40px; background:var(--card-bg); color:var(--text);" />
                <span style="font-size:13px; color:var(--text-secondary);" id="intervalLabel">дн.</span>
            </div>
            <label>Дата окончания повторения (необязательно)</label>
            <input type="date" id="recurrenceUntil" />

            <input type="hidden" id="editingEventId" value="" />

            <button class="btn-primary" onclick="saveEvent()" id="saveEventBtn">Сохранить</button>
            <button class="btn-secondary" onclick="closeEvent()" style="margin-top:8px;">Отмена</button>
        </div>
    </div>

    <script>
        // ============================================================
        //  ДАННЫЕ
        // ============================================================

        const COLORS = ['#3b82f6', '#8b5cf6', '#ec4899', '#ef4444', '#f59e0b', '#22c55e', '#14b8a6'];

        // Загрузка из localStorage
        function loadData() {
            const raw = localStorage.getItem('familyPlannerData');
            if (raw) {
                try { return JSON.parse(raw); } catch(e) {}
            }
            return {
                members: [],
                events: []   // каждый event: { id, name, start, end, participantId, recurrence: { type, interval, until } }
            };
        }

        function saveData() {
            localStorage.setItem('familyPlannerData', JSON.stringify(data));
        }

        let data = loadData();

        // Состояние фильтров
        let filterState = {};
        data.members.forEach(m => filterState[m.id] = true);

        // Смещение недели (0 - текущая)
        let weekOffset = 0;

        // Текущий режим
        let currentView = 'list';

        // Тема
        let currentTheme = 'auto'; // 'auto', 'light', 'dark'

        // ---- Вспомогательные функции ----
        function generateId() {
            return Date.now() + '_' + Math.random().toString(36).substr(2, 6);
        }

        function getMember(id) {
            return data.members.find(m => m.id === id);
        }

        function getMemberColor(id) {
            const m = getMember(id);
            return m ? m.color : '#94a3b8';
        }

        function getMemberName(id) {
            const m = getMember(id);
            return m ? m.name : 'Неизвестный';
        }

        // Получить диапазон недели с учётом смещения
        function getWeekRange(offset = 0) {
            const now = new Date();
            now.setDate(now.getDate() + offset * 7);
            const day = now.getDay();
            const diff = (day === 0 ? 6 : day - 1);
            const monday = new Date(now);
            monday.setDate(now.getDate() - diff);
            monday.setHours(0,0,0,0);
            const sunday = new Date(monday);
            sunday.setDate(monday.getDate() + 6);
            sunday.setHours(23,59,59,999);
            return { monday, sunday };
        }

        function getWeekDays(offset = 0) {
            const { monday } = getWeekRange(offset);
            const days = [];
            for (let i = 0; i < 7; i++) {
                const d = new Date(monday);
                d.setDate(monday.getDate() + i);
                days.push(d);
            }
            return days;
        }

        function formatDate(date) {
            return date.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
        }

        function formatTime(date) {
            return date.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
        }

        // Проверка, попадает ли событие на указанную дату (без учёта времени)
        function isEventOnDate(event, date) {
            const baseStart = new Date(event.start);
            const baseDate = new Date(baseStart.getFullYear(), baseStart.getMonth(), baseStart.getDate());
            const target = new Date(date.getFullYear(), date.getMonth(), date.getDate());

            // Если событие не повторяется
            if (!event.recurrence || event.recurrence.type === 'none') {
                return baseDate.getTime() === target.getTime();
            }

            const rec = event.recurrence;
            const until = rec.until ? new Date(rec.until) : null;
            if (until && target > until) return false;

            // Проверяем, что target >= baseDate (не начинается раньше)
            if (target < baseDate) return false;

            const diffDays = Math.floor((target - baseDate) / (24*60*60*1000));

            switch (rec.type) {
                case 'daily':
                    return diffDays % rec.interval === 0;
                case 'weekly':
                    // День недели должен совпадать, и разница дней кратна 7*interval
                    if (target.getDay() !== baseDate.getDay()) return false;
                    return diffDays % (7 * rec.interval) === 0;
                case 'monthly':
                    // Число месяца должно совпадать, и разница в месяцах кратна interval
                    if (target.getDate() !== baseDate.getDate()) return false;
                    const monthDiff = (target.getFullYear() - baseDate.getFullYear()) * 12 + (target.getMonth() - baseDate.getMonth());
                    return monthDiff % rec.interval === 0 && monthDiff >= 0;
                case 'custom':
                    return diffDays % rec.interval === 0;
                default:
                    return false;
            }
        }

        // Получить все события для заданной даты (с учётом повторений)
        function getEventsForDate(date) {
            const result = [];
            data.events.forEach(ev => {
                if (isEventOnDate(ev, date)) {
                    // Создаём копию с датой, заменённой на целевую, но время оставляем как в оригинале
                    const evCopy = { ...ev };
                    const start = new Date(ev.start);
                    const end = new Date(ev.end);
                    const newStart = new Date(date);
                    newStart.setHours(start.getHours(), start.getMinutes(), 0, 0);
                    const newEnd = new Date(date);
                    newEnd.setHours(end.getHours(), end.getMinutes(), 0, 0);
                    evCopy.start = newStart.toISOString();
                    evCopy.end = newEnd.toISOString();
                    result.push(evCopy);
                }
            });
            return result;
        }

        // Получить события для всей недели (массив по дням)
        function getEventsForWeek(offset = 0) {
            const days = getWeekDays(offset);
            return days.map(date => getEventsForDate(date));
        }

        // Проверка пересечения двух интервалов
        function intervalsOverlap(s1, e1, s2, e2) {
            return s1 < e2 && s2 < e1;
        }

        // ============================================================
        //  РЕНДЕРИНГ
        // ============================================================

        function render() {
            updateWeekLabel();
            renderFilters();
            if (currentView === 'list') {
                renderList();
            } else {
                renderGrid();
            }
        }

        function updateWeekLabel() {
            const { monday, sunday } = getWeekRange(weekOffset);
            const label = document.getElementById('weekLabel');
            label.textContent = `${formatDate(monday)} – ${formatDate(sunday)}`;
        }

        // ---- Фильтры ----
        function renderFilters() {
            const container = document.getElementById('filtersContainer');
            if (data.members.length === 0) {
                container.innerHTML = '<span style="color:var(--text-secondary); font-size:14px;">Добавьте участников в настройках ⚙️</span>';
                return;
            }
            let html = '';
            data.members.forEach(m => {
                const checked = filterState[m.id] !== false;
                html += `
                    <label class="filter-item">
                        <input type="checkbox" data-participant="${m.id}" ${checked ? 'checked' : ''} onchange="toggleFilter('${m.id}')" />
                        <span class="color-dot" style="background:${m.color}"></span>
                        ${m.name}
                    </label>
                `;
            });
            container.innerHTML = html;
        }

        function toggleFilter(id) {
            filterState[id] = !filterState[id];
            render();
        }

        function isFilteredOut(participantId) {
            return filterState[participantId] === false;
        }

        // ---- Режим "Список" ----
        function renderList() {
            const container = document.getElementById('weekContainer');
            const days = getWeekDays(weekOffset);
            const eventsByDay = getEventsForWeek(weekOffset);

            let html = '';
            days.forEach((date, index) => {
                const dayEvents = eventsByDay[index]
                    .filter(ev => !isFilteredOut(ev.participantId))
                    .sort((a,b) => new Date(a.start) - new Date(b.start));

                html += `<div class="day-list">`;
                html += `<div class="day-header">${getDayName(index)} <span class="date">${formatDate(date)}</span></div>`;

                if (dayEvents.length === 0) {
                    html += `<div class="empty-day">Нет событий</div>`;
                } else {
                    dayEvents.forEach(ev => {
                        const participant = getMember(ev.participantId);
                        const color = participant ? participant.color : '#94a3b8';
                        const name = participant ? participant.name : 'Без участника';
                        const start = new Date(ev.start);
                        const end = new Date(ev.end);
                        const timeStr = formatTime(start) + ' – ' + formatTime(end);
                        html += `
                            <div class="event-item">
                                <span class="event-time">${timeStr}</span>
                                <span class="event-name">${ev.name}</span>
                                <span class="event-participant">
                                    <span class="dot" style="background:${color}"></span>
                                    ${name}
                                </span>
                                <div class="event-actions">
                                    <button onclick="editEvent('${ev.id}')" title="Редактировать">✎</button>
                                    <button class="delete-event" onclick="deleteEvent('${ev.id}')" title="Удалить">✕</button>
                                </div>
                            </div>
                        `;
                    });
                }
                html += `</div>`;
            });
            container.innerHTML = html;
        }

        function getDayName(index) {
            const names = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
            return names[index];
        }

        // ---- Режим "Сетка" ----
        function renderGrid() {
            const container = document.getElementById('weekContainer');
            const days = getWeekDays(weekOffset);
            const eventsByDay = getEventsForWeek(weekOffset);

            let html = `<div class="grid-wrapper"><div class="grid-scroll">`;
            days.forEach((date, index) => {
                const dayEvents = eventsByDay[index]
                    .filter(ev => !isFilteredOut(ev.participantId))
                    .sort((a,b) => new Date(a.start) - new Date(b.start));

                html += `<div class="grid-day">`;
                html += `<div class="grid-day-header">${getDayName(index)}<br><span class="date">${formatDate(date)}</span></div>`;

                // Временная шкала
                const hourHeight = window.innerWidth <= 480 ? 24 : 32;
                const totalHeight = 24 * hourHeight;
                html += `<div class="grid-timeline" style="height:${totalHeight}px;">`;

                // Рисуем сетку часов и определяем конфликты
                // Для каждого часа проверим, есть ли пересечения между событиями разных участников
                const conflicts = new Array(24).fill(false);
                // Проверим каждый час: есть ли два события, которые пересекаются в этом часе?
                for (let h = 0; h < 24; h++) {
                    const hourStart = h;
                    const hourEnd = h + 1;
                    // Соберём события, которые пересекаются с этим часом (даже частично)
                    const eventsInHour = dayEvents.filter(ev => {
                        const s = new Date(ev.start);
                        const e = new Date(ev.end);
                        const sHour = s.getHours() + s.getMinutes() / 60;
                        const eHour = e.getHours() + e.getMinutes() / 60;
                        return intervalsOverlap(sHour, eHour, hourStart, hourEnd);
                    });
                    // Проверим, есть ли среди них события разных участников
                    const participants = new Set(eventsInHour.map(ev => ev.participantId));
                    if (participants.size >= 2) {
                        conflicts[h] = true;
                    }
                }

                // Отображаем часы
                for (let h = 0; h < 24; h++) {
                    const top = h * hourHeight;
                    const conflictClass = conflicts[h] ? ' conflict' : '';
                    html += `<div class="grid-hour${conflictClass}" style="top:${top}px; height:${hourHeight}px;">${h}:00${conflicts[h] ? ' ⚠️' : ''}</div>`;
                }

                // Рисуем события (поверх часов)
                dayEvents.forEach(ev => {
                    const start = new Date(ev.start);
                    const end = new Date(ev.end);
                    const startHour = start.getHours() + start.getMinutes() / 60;
                    const endHour = end.getHours() + end.getMinutes() / 60;
                    const duration = endHour - startHour;
                    if (duration <= 0) return;
                    const top = startHour * hourHeight;
                    const height = duration * hourHeight;
                    const color = getMemberColor(ev.participantId);
                    const name = getMemberName(ev.participantId);
                    html += `
                        <div class="grid-event-block" style="top:${top}px; height:${height}px; background:${color};">
                            <strong>${ev.name}</strong>
                            <span class="time">${formatTime(start)} – ${formatTime(end)}</span>
                            <span class="participant">${name}</span>
                        </div>
                    `;
                });

                html += `</div></div>`; // закрываем timeline и grid-day
            });

            html += `</div></div>`;
            container.innerHTML = html;
        }

        // ============================================================
        //  НАВИГАЦИЯ ПО НЕДЕЛЯМ
        // ============================================================

        function changeWeek(delta) {
            weekOffset += delta;
            render();
        }

        // ============================================================
        //  ДОБАВЛЕНИЕ / РЕДАКТИРОВАНИЕ / УДАЛЕНИЕ
        // ============================================================

        function openAddEvent() {
            document.getElementById('eventModalTitle').textContent = '➕ Новое событие';
            document.getElementById('editingEventId').value = '';
            document.getElementById('saveEventBtn').textContent = 'Сохранить';
            // Сброс полей
            document.getElementById('eventName').value = '';
            const now = new Date();
            const localISOTime = (date) => {
                const offset = date.getTimezoneOffset();
                const local = new Date(date.getTime() - offset * 60000);
                return local.toISOString().slice(0, 16);
            };
            document.getElementById('eventStart').value = localISOTime(now);
            const end = new Date(now);
            end.setHours(now.getHours() + 1);
            document.getElementById('eventEnd').value = localISOTime(end);
            document.getElementById('recurrenceType').value = 'none';
            document.getElementById('recurrenceInterval').value = 1;
            document.getElementById('recurrenceUntil').value = '';
            populateParticipantSelect();
            openModal('eventModal');
        }

        function editEvent(eventId) {
            const ev = data.events.find(e => e.id === eventId);
            if (!ev) return;
            document.getElementById('eventModalTitle').textContent = '✎ Редактировать событие';
            document.getElementById('editingEventId').value = eventId;
            document.getElementById('saveEventBtn').textContent = 'Обновить';
            document.getElementById('eventName').value = ev.name;
            document.getElementById('eventStart').value = new Date(ev.start).toISOString().slice(0, 16);
            document.getElementById('eventEnd').value = new Date(ev.end).toISOString().slice(0, 16);
            document.getElementById('eventParticipant').value = ev.participantId;
            if (ev.recurrence) {
                document.getElementById('recurrenceType').value = ev.recurrence.type;
                document.getElementById('recurrenceInterval').value = ev.recurrence.interval || 1;
                document.getElementById('recurrenceUntil').value = ev.recurrence.until ? new Date(ev.recurrence.until).toISOString().slice(0, 10) : '';
            } else {
                document.getElementById('recurrenceType').value = 'none';
                document.getElementById('recurrenceInterval').value = 1;
                document.getElementById('recurrenceUntil').value = '';
            }
            populateParticipantSelect();
            openModal('eventModal');
        }

        function populateParticipantSelect() {
            const select = document.getElementById('eventParticipant');
            select.innerHTML = '';
            if (data.members.length === 0) {
                select.innerHTML = '<option value="">Сначала добавьте участников</option>';
            } else {
                data.members.forEach(m => {
                    const opt = document.createElement('option');
                    opt.value = m.id;
                    opt.textContent = m.name;
                    select.appendChild(opt);
                });
            }
        }

        function saveEvent() {
            const id = document.getElementById('editingEventId').value;
            const name = document.getElementById('eventName').value.trim();
            const start = document.getElementById('eventStart').value;
            const end = document.getElementById('eventEnd').value;
            const participantId = document.getElementById('eventParticipant').value;
            const recType = document.getElementById('recurrenceType').value;
            const recInterval = parseInt(document.getElementById('recurrenceInterval').value) || 1;
            const recUntil = document.getElementById('recurrenceUntil').value;

            if (!name || !start || !end || !participantId) {
                alert('Заполните все поля!');
                return;
            }
            if (new Date(start) >= new Date(end)) {
                alert('Время окончания должно быть позже времени начала.');
                return;
            }

            const recurrence = {
                type: recType,
                interval: recInterval,
                until: recUntil || null
            };

            if (id) {
                // Редактирование
                const ev = data.events.find(e => e.id === id);
                if (ev) {
                    ev.name = name;
                    ev.start = start;
                    ev.end = end;
                    ev.participantId = participantId;
                    ev.recurrence = recurrence;
                }
            } else {
                // Новое событие
                data.events.push({
                    id: generateId(),
                    name,
                    start,
                    end,
                    participantId,
                    recurrence
                });
            }

            saveData();
            closeModal('eventModal');
            render();
        }

        function deleteEvent(id) {
            if (!confirm('Удалить событие?')) return;
            data.events = data.events.filter(e => e.id !== id);
            saveData();
            render();
        }

        // ============================================================
        //  НАСТРОЙКИ СЕМЬИ
        // ============================================================

        let selectedColor = COLORS[0];

        function openSettings() {
            openModal('settingsModal');
            renderMembers();
            renderColorOptions();
        }

        function closeSettings() {
            closeModal('settingsModal');
        }

        function renderMembers() {
            const container = document.getElementById('memberList');
            if (data.members.length === 0) {
                container.innerHTML = '<p style="color:var(--text-secondary);">Пока нет участников. Добавьте первого!</p>';
                return;
            }
            let html = '';
            data.members.forEach(m => {
                html += `
                    <div class="member-row">
                        <span class="color-dot" style="background:${m.color}"></span>
                        <span>${m.name}</span>
                        <button onclick="removeMember('${m.id}')">✕</button>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function renderColorOptions() {
            const container = document.getElementById('colorSelect');
            container.innerHTML = '';
            COLORS.forEach(c => {
                const div = document.createElement('div');
                div.className = 'color-option' + (c === selectedColor ? ' selected' : '');
                div.style.background = c;
                div.dataset.color = c;
                div.onclick = function() {
                    document.querySelectorAll('.color-option').forEach(el => el.classList.remove('selected'));
                    this.classList.add('selected');
                    selectedColor = this.dataset.color;
                };
                container.appendChild(div);
            });
        }

        function addMember() {
            const input = document.getElementById('newMemberName');
            const name = input.value.trim();
            if (!name) {
                alert('Введите имя');
                return;
            }
            if (data.members.some(m => m.name.toLowerCase() === name.toLowerCase())) {
                alert('Участник с таким именем уже есть');
                return;
            }
            data.members.push({
                id: generateId(),
                name: name,
                color: selectedColor
            });
            saveData();
            input.value = '';
            selectedColor = COLORS[0];
            renderColorOptions();
            renderMembers();
            // Обновляем фильтры
            filterState[data.members[data.members.length-1].id] = true;
            render();
        }

        function removeMember(id) {
            if (!confirm('Удалить участника? Его события сохранятся, но он будет отображаться как "Неизвестный".')) return;
            data.members = data.members.filter(m => m.id !== id);
            delete filterState[id];
            saveData();
            renderMembers();
            render();
        }

        // ============================================================
        //  МОДАЛЬНЫЕ ОКНА
        // ============================================================

        function openModal(id) {
            document.getElementById(id).classList.add('active');
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        function closeEvent() {
            closeModal('eventModal');
        }

        // ============================================================
        //  ТЕМНАЯ ТЕМА
        // ============================================================

        function applyTheme(theme) {
            const body = document.body;
            if (theme === 'dark') {
                body.classList.add('dark');
                document.querySelector('.theme-toggle').textContent = '☀️';
            } else if (theme === 'light') {
                body.classList.remove('dark');
                document.querySelector('.theme-toggle').textContent = '🌙';
            } else {
                // auto – определяем по системной
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (prefersDark) {
                    body.classList.add('dark');
                    document.querySelector('.theme-toggle').textContent = '☀️';
                } else {
                    body.classList.remove('dark');
                    document.querySelector('.theme-toggle').textContent = '🌙';
                }
            }
            currentTheme = theme;
            localStorage.setItem('themePreference', theme);
        }

        function toggleTheme() {
            if (currentTheme === 'light') {
                applyTheme('dark');
            } else if (currentTheme === 'dark') {
                applyTheme('light');
            } else {
                // если был auto, переключаем на противоположный текущему
                const isDark = document.body.classList.contains('dark');
                applyTheme(isDark ? 'light' : 'dark');
            }
        }

        // Инициализация темы
        function initTheme() {
            const saved = localStorage.getItem('themePreference');
            if (saved) {
                applyTheme(saved);
            } else {
                applyTheme('auto');
            }
            // Слушаем изменение системной темы, если не выбрано вручную
            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
                if (currentTheme === 'auto') {
                    applyTheme('auto');
                }
            });
        }

        // ============================================================
        //  ПЕРЕКЛЮЧЕНИЕ РЕЖИМОВ
        // ============================================================

        function setView(view) {
            currentView = view;
            document.querySelectorAll('.view-switch button').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.view === view);
            });
            render();
        }

        // ============================================================
        //  ИНИЦИАЛИЗАЦИЯ
        // ============================================================

        initTheme();
        render();
    </script>
</body>
</html>
