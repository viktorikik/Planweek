<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Семейный планировщик</title>
    <style>
        /* ----- CSS-переменные (без изменений) ----- */
        :root {
            --bg: #f4f6f9;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-secondary: #475569;
            --border: #e2e8f0;
            --shadow: 0 2px 8px rgba(0,0,0,0.04);
            --filter-bg: #ffffff;
            --switch-bg: #e9edf3;
            --switch-active: #ffffff;
            --day-bg: #ffffff;
            --grid-bg: #f8fafc;
            --grid-cell: #ffffff;
            --hour-line: #eef2f6;
            --conflict-bg: #fee2e2;
            --fab-bg: #2563eb;
            --fab-text: #ffffff;
            --drag-shadow: 0 8px 30px rgba(0,0,0,0.2);
            --warning-bg: #fef3c7;
            --warning-text: #92400e;
            --month-day-bg: #ffffff;
            --mode-btn-bg: #e9edf3;
            --mode-btn-active: #ffffff;
        }
        body.dark {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f1f5f9;
            --text-secondary: #94a3b8;
            --border: #334155;
            --shadow: 0 2px 8px rgba(0,0,0,0.3);
            --filter-bg: #1e293b;
            --switch-bg: #334155;
            --switch-active: #0f172a;
            --day-bg: #1e293b;
            --grid-bg: #1e293b;
            --grid-cell: #1e293b;
            --hour-line: #334155;
            --conflict-bg: #7f1d1d;
            --fab-bg: #3b82f6;
            --fab-text: #ffffff;
            --drag-shadow: 0 8px 30px rgba(0,0,0,0.5);
            --warning-bg: #78350f;
            --warning-text: #fbbf24;
            --month-day-bg: #1e293b;
            --mode-btn-bg: #334155;
            --mode-btn-active: #0f172a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 16px 12px 80px 12px;
            transition: background 0.2s, color 0.2s;
            touch-action: pan-y;
        }
        h1 {
            font-size: 24px;
            font-weight: 600;
            text-align: center;
            margin: 0 0 8px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .header-actions {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        .btn-edit-members, .btn-analytics {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 40px;
            padding: 8px 20px;
            font-size: 16px;
            font-weight: 500;
            color: var(--text);
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-edit-members:hover, .btn-analytics:hover {
            background: var(--switch-bg);
        }
        .theme-toggle {
            font-size: 24px;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text);
            padding: 4px 8px;
            border-radius: 30px;
            transition: 0.2s;
        }
        .theme-toggle:hover { background: var(--border); }
        .week-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            background: var(--card-bg);
            padding: 8px 16px;
            border-radius: 40px;
            box-shadow: var(--shadow);
            touch-action: none;
        }
        .week-nav .week-label { font-weight: 500; font-size: 16px; }
        .week-nav button {
            background: none; border: none; font-size: 24px; cursor: pointer;
            color: var(--text); padding: 0 8px; transition: 0.2s;
        }
        .week-nav button:hover { color: var(--fab-bg); }
        .filters {
            display: flex; flex-wrap: wrap; gap: 8px 14px;
            background: var(--filter-bg); padding: 12px 16px;
            border-radius: 40px; margin-bottom: 16px;
            box-shadow: var(--shadow); justify-content: center;
            transition: background 0.2s;
        }
        .filter-item {
            display: flex; align-items: center; gap: 4px;
            font-size: 14px; cursor: pointer; color: var(--text);
        }
        .filter-item input[type="checkbox"] {
            width: 18px; height: 18px; accent-color: currentColor; cursor: pointer;
        }
        .color-dot {
            display: inline-block; width: 14px; height: 14px;
            border-radius: 50%;
            border: 1px solid rgba(0,0,0,0.1); flex-shrink: 0;
        }
        .view-switch {
            display: flex; justify-content: center; gap: 6px;
            background: var(--switch-bg); border-radius: 40px; padding: 4px;
            margin-bottom: 16px; transition: background 0.2s;
        }
        .view-switch button {
            flex: 1; max-width: 100px; padding: 8px 12px;
            border: none; border-radius: 30px; background: transparent;
            font-weight: 500; font-size: 15px; cursor: pointer;
            transition: 0.2s; color: var(--text-secondary);
        }
        .view-switch button.active {
            background: var(--switch-active); box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            color: var(--text);
        }
        .week-container { display: flex; flex-direction: column; gap: 12px; touch-action: pan-y; }
        .day-list {
            background: var(--day-bg); border-radius: 20px; padding: 12px 16px;
            box-shadow: var(--shadow); transition: background 0.2s;
        }
        .day-header {
            font-weight: 600; font-size: 18px; display: flex;
            justify-content: space-between; border-bottom: 1px solid var(--border);
            padding-bottom: 8px; margin-bottom: 8px; color: var(--text);
        }
        .day-header .date { font-weight: 400; color: var(--text-secondary); font-size: 14px; }
        .event-item {
            display: flex; align-items: center; gap: 10px;
            padding: 8px 0; border-bottom: 1px solid var(--border); color: var(--text);
        }
        .event-item:last-child { border-bottom: none; }
        .event-time {
            font-size: 13px; font-weight: 500; color: var(--text-secondary); min-width: 80px;
        }
        .event-name { flex: 1; font-size: 15px; }
        .event-participant {
            font-size: 13px; padding: 2px 12px; border-radius: 30px;
            background: var(--border); white-space: nowrap; color: var(--text);
        }
        .event-participant .dot {
            display: inline-block; width: 10px; height: 10px;
            border-radius: 50%; margin-right: 4px;
        }
        .empty-day { color: var(--text-secondary); font-size: 14px; padding: 6px 0; text-align: center; }
        .event-actions button {
            background: none; border: none; cursor: pointer;
            font-size: 18px; color: var(--text-secondary); padding: 0 4px; transition: 0.2s;
        }
        .event-actions button:hover { color: var(--fab-bg); }
        .event-actions .delete-event:hover { color: #ef4444; }

        /* Сетка — исправлена прокрутка и отображение */
        .grid-wrapper {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin: 0 -12px;
            padding: 0 12px;
            touch-action: pan-x; /* разрешаем горизонтальную прокрутку */
        }
        .grid-scroll {
            display: flex;
            gap: 4px;
            min-width: 700px;
            touch-action: pan-x; /* для горизонтальной прокрутки */
        }
        .grid-day {
            flex: 1;
            min-width: 80px;
            position: relative;
            background: var(--grid-bg);
            border-radius: 12px;
            padding: 0 4px 4px 4px;
            transition: background 0.2s;
            touch-action: pan-y; /* вертикальная прокрутка внутри дня */
        }
        .grid-day-header {
            text-align: center; font-weight: 600; padding: 8px 0;
            background: var(--card-bg); border-radius: 12px 12px 0 0; color: var(--text);
        }
        .grid-day-header .date { font-weight: 400; font-size: 12px; color: var(--text-secondary); }
        .grid-timeline {
            position: relative; height: 768px; background: var(--grid-cell);
            border-radius: 0 0 12px 12px; overflow: hidden; transition: background 0.2s;
            touch-action: pan-y; /* вертикальная прокрутка внутри дня */
        }
        .grid-hour {
            position: absolute; left: 0; right: 0; border-top: 1px solid var(--hour-line);
            height: 32px; display: flex; align-items: center; padding-left: 4px;
            font-size: 10px; color: var(--text-secondary); transition: background 0.2s;
            z-index: 1;
        }
        .grid-hour.conflict { background: var(--conflict-bg) !important; }
        .grid-hour-overlay {
            position: absolute; left: 0; right: 0; height: 32px;
            z-index: 2; pointer-events: none; opacity: 0.5;
        }
        .grid-event-block {
            position: absolute; left: 4px; right: 4px; border-radius: 6px;
            padding: 2px 6px; color: white; font-size: 11px; overflow: hidden;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
            display: flex; flex-direction: column; justify-content: center;
            cursor: pointer;
            z-index: 5; transition: box-shadow 0.2s, opacity 0.2s;
            touch-action: none;
        }
        .grid-event-block.conflict { outline: 3px solid #ef4444; outline-offset: -2px; }
        .grid-event-block .conflict-badge {
            position: absolute; top: -6px; right: -6px; background: #ef4444;
            color: white; border-radius: 50%; width: 18px; height: 18px;
            font-size: 12px; display: flex; align-items: center; justify-content: center;
        }
        .grid-event-block strong { font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .grid-event-block .time { font-size: 9px; opacity: 0.9; }
        .grid-event-block .participant { font-size: 9px; opacity: 0.8; }

        /* Месяц */
        .month-grid {
            background: var(--card-bg); border-radius: 20px; padding: 12px;
            box-shadow: var(--shadow);
        }
        .month-header {
            display: grid; grid-template-columns: repeat(7, 1fr);
            text-align: center; font-weight: 600; color: var(--text-secondary);
            font-size: 14px; margin-bottom: 8px;
        }
        .month-days {
            display: grid; grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }
        .month-day {
            background: var(--month-day-bg); border-radius: 12px;
            padding: 6px 2px; text-align: center; min-height: 60px;
            transition: background 0.2s; cursor: pointer;
            display: flex; flex-direction: column; align-items: center;
            border: 1px solid transparent;
        }
        .month-day.other-month { opacity: 0.4; }
        .month-day .day-number {
            font-weight: 500; font-size: 16px; color: var(--text);
        }
        .month-day .day-dots {
            display: flex; flex-wrap: wrap; justify-content: center;
            gap: 2px; margin-top: 4px;
        }
        .month-day .day-dots .dot {
            width: 10px; height: 10px; border-radius: 50%;
            border: 1px solid rgba(0,0,0,0.1);
        }
        .month-day.today { border-color: var(--fab-bg); background: var(--switch-bg); }

        /* Модалки */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0;
            width: 100%; height: 100%; background: rgba(0,0,0,0.4);
            backdrop-filter: blur(2px); z-index: 2000;
            justify-content: center; align-items: center; padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: var(--card-bg); border-radius: 28px;
            max-width: 500px; width: 100%; padding: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            max-height: 90vh; overflow-y: auto;
            color: var(--text); transition: background 0.2s, color 0.2s;
        }
        .modal h2 {
            font-size: 22px; margin-bottom: 16px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .modal h2 button {
            background: none; border: none; font-size: 28px;
            cursor: pointer; color: var(--text-secondary);
        }
        .modal label {
            display: block; font-weight: 500; margin: 12px 0 4px; font-size: 14px;
        }
        .modal input[type="text"], .modal input[type="datetime-local"],
        .modal select, .modal textarea {
            width: 100%; padding: 10px 14px;
            border: 1px solid var(--border); border-radius: 40px;
            font-size: 16px; margin-bottom: 8px;
            background: var(--card-bg); color: var(--text);
            transition: background 0.2s, color 0.2s; font-family: inherit;
        }
        .modal textarea { border-radius: 20px; resize: vertical; min-height: 60px; }
        .modal .color-select {
            display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px;
        }
        .modal .color-option {
            width: 40px; height: 40px; border-radius: 50%;
            cursor: pointer; transition: 0.2s; border: 3px solid transparent;
        }
        .modal .color-option.selected {
            border-color: var(--text); transform: scale(1.15);
        }
        .modal .member-list { margin: 16px 0; }
        .modal .member-row {
            display: flex; align-items: center; gap: 10px;
            padding: 8px 0; border-bottom: 1px solid var(--border);
        }
        .modal .member-row .color-dot {
            width: 24px; height: 24px; border-radius: 50%;
        }
        .modal .member-row span { flex: 1; }
        .modal .member-row button {
            background: none; border: none; color: #ef4444;
            font-size: 18px; cursor: pointer;
        }
        .recurrence-group {
            display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px;
        }
        .recurrence-group select, .recurrence-group input { flex: 1; min-width: 80px; }
        .checkbox-row {
            display: flex; align-items: center; gap: 8px; margin: 8px 0;
        }
        .checkbox-row input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--fab-bg); }
        .btn-primary {
            background: var(--fab-bg); color: white; border: none;
            padding: 12px 24px; border-radius: 40px; font-size: 16px;
            font-weight: 500; width: 100%; cursor: pointer; transition: 0.2s;
        }
        .btn-primary:hover { opacity: 0.9; }
        .btn-secondary {
            background: var(--border); color: var(--text); border: none;
            padding: 10px 20px; border-radius: 40px; font-size: 14px;
            cursor: pointer; transition: 0.2s;
        }
        .btn-secondary:hover { opacity: 0.8; }
        .btn-warning {
            background: var(--warning-bg); color: var(--warning-text);
            border: none; padding: 10px 20px; border-radius: 40px;
            font-size: 14px; cursor: pointer; transition: 0.2s; font-weight: 500;
        }
        .btn-warning:hover { opacity: 0.8; }
        .fab {
            position: fixed; bottom: 24px; right: 24px;
            width: 64px; height: 64px; border-radius: 50%;
            background: var(--fab-bg); color: var(--fab-text);
            border: none; font-size: 36px;
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.35);
            cursor: pointer; transition: 0.2s; z-index: 500;
            display: flex; align-items: center; justify-content: center;
        }
        .fab:hover { transform: scale(1.05); }

        .mode-switch {
            display: flex; gap: 6px; background: var(--mode-btn-bg);
            border-radius: 40px; padding: 4px; margin-bottom: 16px;
        }
        .mode-btn {
            flex: 1; padding: 8px 12px; border: none; border-radius: 30px;
            background: transparent; font-weight: 500; font-size: 14px;
            cursor: pointer; transition: 0.2s; color: var(--text-secondary);
        }
        .mode-btn.active {
            background: var(--mode-btn-active); box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            color: var(--text);
        }
        #textFields textarea {
            border-radius: 20px; resize: vertical; min-height: 80px;
        }

        .analytics-result { margin-top: 16px; }
        .analytics-table {
            width: 100%; border-collapse: collapse; margin-top: 8px;
        }
        .analytics-table th, .analytics-table td {
            padding: 6px 10px; border-bottom: 1px solid var(--border);
            text-align: left; font-size: 14px;
        }
        .analytics-table th { font-weight: 600; color: var(--text-secondary); }
        .chart-container {
            margin-top: 16px; display: flex; justify-content: center;
        }
        .chart-container canvas { max-width: 100%; max-height: 250px; }

        @media (max-width: 480px) {
            body { padding: 12px 8px 80px 8px; }
            .filters { padding: 8px 12px; gap: 4px 10px; }
            .filter-item { font-size: 13px; }
            .view-switch button { font-size: 14px; padding: 6px 10px; max-width: 80px; }
            .day-header { font-size: 16px; }
            .event-time { min-width: 60px; font-size: 12px; }
            .event-name { font-size: 14px; }
            .modal { padding: 16px; }
            .grid-scroll { min-width: 480px; }
            .grid-timeline { height: 576px; }
            .grid-hour { height: 24px; }
            .grid-event-block { font-size: 10px; }
            .month-day { min-height: 50px; padding: 4px 2px; }
            .month-day .day-number { font-size: 14px; }
        }
    </style>
</head>
<body>
    <h1>
        📅 Семейный план
        <button class="theme-toggle" onclick="toggleTheme()" title="Сменить тему">🌙</button>
    </h1>
    <div class="header-actions">
        <button class="btn-edit-members" onclick="openSettings()">✏️ Редактировать участников</button>
        <button class="btn-analytics" onclick="openAnalytics()">📊 Аналитика</button>
    </div>
    <div class="week-nav">
        <button onclick="changePeriod(-1)">◀</button>
        <span class="week-label" id="periodLabel">Неделя</span>
        <button onclick="changePeriod(1)">▶</button>
    </div>
    <div class="filters" id="filtersContainer"></div>
    <div class="view-switch">
        <button class="active" data-view="list" onclick="setView('list')">📋 Список</button>
        <button data-view="grid" onclick="setView('grid')">📊 Сетка</button>
        <button data-view="month" onclick="setView('month')">📅 Месяц</button>
    </div>
    <div class="week-container" id="weekContainer"></div>
    <button class="fab" onclick="openAddEvent()">＋</button>

    <!-- Модалка настроек -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal">
            <h2>👨‍👩‍👧‍👦 Семья <button onclick="closeSettings()">✕</button></h2>
            <div class="member-list" id="memberList"></div>
            <label>Добавить участника</label>
            <div style="display:flex; gap:8px; flex-wrap:wrap;">
                <input type="text" id="newMemberName" placeholder="Имя" style="flex:1; padding:10px 14px; border:1px solid var(--border); border-radius:40px; background:var(--card-bg); color:var(--text);" />
                <div class="color-select" id="colorSelect"></div>
            </div>
            <button class="btn-primary" onclick="addMember()" style="margin-top:12px;">➕ Добавить</button>
            <button class="btn-secondary" onclick="closeSettings()" style="margin-top:8px;">Закрыть</button>
        </div>
    </div>

    <!-- Модалка события -->
    <div class="modal-overlay" id="eventModal">
        <div class="modal">
            <h2><span id="eventModalTitle">➕ Новое событие</span><button onclick="closeEvent()">✕</button></h2>
            <div class="mode-switch">
                <button class="mode-btn active" data-mode="manual" onclick="switchEventMode('manual')">✏️ Вручную</button>
                <button class="mode-btn" data-mode="text" onclick="switchEventMode('text')">📝 Текстом</button>
            </div>
            <div id="manualFields">
                <label>Название</label>
                <input type="text" id="eventName" placeholder="Например: Футбол" />
                <label>Начало</label>
                <input type="datetime-local" id="eventStart" />
                <label>Окончание</label>
                <input type="datetime-local" id="eventEnd" />
                <label>Участник</label>
                <select id="eventParticipant"></select>
                <label>Повторение</label>
                <div class="recurrence-group">
                    <select id="recurrenceType">
                        <option value="none">Нет</option>
                        <option value="daily">Ежедневно</option>
                        <option value="weekly">Еженедельно</option>
                        <option value="weekly_workdays">Рабочие дни (5/2)</option>
                        <option value="monthly">Ежемесячно</option>
                        <option value="custom">Каждые N дней</option>
                    </select>
                    <input type="number" id="recurrenceInterval" value="1" min="1" style="width:70px;" />
                    <span id="intervalLabel">дн.</span>
                </div>
                <label>Дата окончания повторения (необязательно)</label>
                <input type="date" id="recurrenceUntil" />
                <div class="checkbox-row">
                    <input type="checkbox" id="allowOverlap" />
                    <label for="allowOverlap">✅ Разрешено пересечение (не считать конфликтом)</label>
                </div>
                <label>Заметки</label>
                <textarea id="eventNotes" placeholder="Дополнительная информация..." rows="2"></textarea>
            </div>
            <div id="textFields" style="display:none;">
                <label>Введите описание события</label>
                <textarea id="eventTextInput" placeholder="Например: Ужин с Аней завтра в 19:00" rows="3"></textarea>
                <button class="btn-primary" onclick="parseAndFillEvent()">🔍 Распознать</button>
                <p style="font-size:13px; color:var(--text-secondary); margin-top:8px;">
                    Поддерживается: время (19:00, 7 вечера), дата (сегодня, завтра, пятница, 20 мая), участник (с Аней).
                </p>
            </div>
            <input type="hidden" id="editingEventId" value="" />
            <button class="btn-primary" onclick="saveEvent()" id="saveEventBtn" style="margin-top:12px;">Сохранить</button>
            <button class="btn-secondary" onclick="closeEvent()" style="margin-top:8px;">Отмена</button>
        </div>
    </div>

    <!-- Модалка конфликта -->
    <div class="modal-overlay" id="conflictModal">
        <div class="modal">
            <h2>⚠️ Обнаружен конфликт</h2>
            <p id="conflictMessage" style="margin:16px 0; line-height:1.5;"></p>
            <div style="display:flex; gap:10px; flex-wrap:wrap;">
                <button class="btn-warning" onclick="acceptConflict()" style="flex:1;">✅ Принять конфликт</button>
                <button class="btn-secondary" onclick="rejectConflict()" style="flex:1;">✏️ Изменить время</button>
            </div>
        </div>
    </div>

    <!-- Модалка аналитики -->
    <div class="modal-overlay" id="analyticsModal">
        <div class="modal">
            <h2>📊 Аналитика <button onclick="closeAnalytics()">✕</button></h2>
            <label>Период с</label>
            <input type="date" id="analyticsStart" />
            <label>по</label>
            <input type="date" id="analyticsEnd" />
            <label>Участник</label>
            <select id="analyticsParticipant">
                <option value="all">Все</option>
            </select>
            <button class="btn-primary" onclick="showAnalytics()" style="margin-top:12px;">Показать</button>
            <div class="analytics-result" id="analyticsResult"></div>
            <div class="chart-container">
                <canvas id="analyticsChart" width="400" height="300"></canvas>
            </div>
        </div>
    </div>

    <!-- Модалка просмотра дня в месяце -->
    <div class="modal-overlay" id="dayEventsModal">
        <div class="modal">
            <h2><span id="dayEventsTitle">События</span><button onclick="closeDayEvents()">✕</button></h2>
            <div id="dayEventsList"></div>
        </div>
    </div>

    <script>
        // ============================================================
        //  ДАННЫЕ И ХРАНИЛИЩЕ
        // ============================================================
        const COLORS = ['#4F46E5','#7C3AED','#EC4899','#EF4444','#F59E0B','#10B981','#06B6D4'];

        function loadData() {
            const raw = localStorage.getItem('familyPlannerData');
            if (raw) {
                try { return JSON.parse(raw); } catch(e) {}
            }
            return { members: [], events: [] };
        }
        function saveData() {
            localStorage.setItem('familyPlannerData', JSON.stringify(data));
        }
        let data = loadData();

        let filterState = {};
        data.members.forEach(m => filterState[m.id] = true);
        let periodOffset = 0;
        let currentView = 'list';
        let currentTheme = 'auto';
        let pendingEvent = null;
        let currentEventMode = 'manual';

        function generateId() { return Date.now() + '_' + Math.random().toString(36).substr(2, 6); }
        function getMember(id) { return data.members.find(m => m.id === id); }
        function getMemberColor(id) { const m = getMember(id); return m ? m.color : '#94a3b8'; }
        function getMemberName(id) { const m = getMember(id); return m ? m.name : 'Неизвестный'; }

        // ---- Даты ----
        function getWeekRange(offset = 0) {
            const now = new Date();
            now.setDate(now.getDate() + offset * 7);
            const day = now.getDay();
            const diff = (day === 0 ? 6 : day - 1);
            const monday = new Date(now);
            monday.setDate(now.getDate() - diff);
            monday.setHours(0,0,0,0);
            const sunday = new Date(monday);
            sunday.setDate(monday.getDate() + 6);
            sunday.setHours(23,59,59,999);
            return { monday, sunday };
        }

        function getMonthRange(offset = 0) {
            const now = new Date();
            now.setMonth(now.getMonth() + offset);
            const first = new Date(now.getFullYear(), now.getMonth(), 1);
            const last = new Date(now.getFullYear(), now.getMonth() + 1, 0);
            return { first, last };
        }

        function getWeekDays(offset = 0) {
            const { monday } = getWeekRange(offset);
            const days = [];
            for (let i = 0; i < 7; i++) {
                const d = new Date(monday);
                d.setDate(monday.getDate() + i);
                days.push(d);
            }
            return days;
        }

        function formatDate(date) {
            return date.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
        }
        function formatDateFull(date) {
            return date.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
        }
        function formatTime(date) {
            return date.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
        }

        function toLocalDatetime(date) {
            const offset = date.getTimezoneOffset();
            const local = new Date(date.getTime() - offset * 60000);
            return local.toISOString().slice(0, 16);
        }

        function dateOnly(date) {
            return new Date(date.getFullYear(), date.getMonth(), date.getDate());
        }

        // ---- События с повторениями ----
        function isEventOnDate(event, date) {
            const baseStart = new Date(event.start);
            const baseDate = dateOnly(baseStart);
            const target = dateOnly(date);
            if (!event.recurrence || event.recurrence.type === 'none') {
                return baseDate.getTime() === target.getTime();
            }
            const rec = event.recurrence;
            const until = rec.until ? new Date(rec.until) : null;
            if (until && target > until) return false;
            if (target < baseDate) return false;
            const diffDays = Math.floor((target - baseDate) / (24*60*60*1000));
            switch (rec.type) {
                case 'daily': return diffDays % rec.interval === 0;
                case 'weekly': {
                    if (target.getDay() !== baseDate.getDay()) return false;
                    return diffDays % (7 * rec.interval) === 0;
                }
                case 'weekly_workdays': {
                    const day = target.getDay();
                    if (day === 0 || day === 6) return false;
                    return diffDays % rec.interval === 0;
                }
                case 'monthly': {
                    if (target.getDate() !== baseDate.getDate()) return false;
                    const monthDiff = (target.getFullYear() - baseDate.getFullYear()) * 12 + (target.getMonth() - baseDate.getMonth());
                    return monthDiff % rec.interval === 0 && monthDiff >= 0;
                }
                case 'custom': return diffDays % rec.interval === 0;
                default: return false;
            }
        }

        function getEventsForDate(date) {
            const result = [];
            data.events.forEach(ev => {
                if (isEventOnDate(ev, date)) {
                    const evCopy = { ...ev };
                    const start = new Date(ev.start);
                    const end = new Date(ev.end);
                    const newStart = new Date(date);
                    newStart.setHours(start.getHours(), start.getMinutes(), 0, 0);
                    const newEnd = new Date(date);
                    newEnd.setHours(end.getHours(), end.getMinutes(), 0, 0);
                    evCopy.start = newStart.toISOString();
                    evCopy.end = newEnd.toISOString();
                    result.push(evCopy);
                }
            });
            return result;
        }

        function getEventsForPeriod(startDate, endDate) {
            const result = [];
            const start = dateOnly(startDate);
            const end = dateOnly(endDate);
            let current = new Date(start);
            while (current <= end) {
                const events = getEventsForDate(current);
                events.forEach(ev => {
                    let evStart = new Date(ev.start);
                    let evEnd = new Date(ev.end);
                    if (evStart < startDate) evStart = startDate;
                    if (evEnd > endDate) evEnd = endDate;
                    if (evStart < evEnd) {
                        const copy = { ...ev, start: evStart.toISOString(), end: evEnd.toISOString() };
                        result.push(copy);
                    }
                });
                current.setDate(current.getDate() + 1);
            }
            return result;
        }

        function intervalsOverlap(s1, e1, s2, e2) {
            return s1 < e2 && s2 < e1;
        }

        function hasConflict(event, others) {
            if (event.allowOverlap) return false;
            const s1 = new Date(event.start).getTime();
            const e1 = new Date(event.end).getTime();
            for (let other of others) {
                if (other.id === event.id) continue;
                if (other.allowOverlap) continue;
                if (other.participantId === event.participantId) continue;
                const s2 = new Date(other.start).getTime();
                const e2 = new Date(other.end).getTime();
                if (intervalsOverlap(s1, e1, s2, e2)) return true;
            }
            return false;
        }

        // ============================================================
        //  РЕНДЕРИНГ
        // ============================================================
        function render() {
            updatePeriodLabel();
            renderFilters();
            if (currentView === 'list') renderList();
            else if (currentView === 'grid') renderGrid();
            else if (currentView === 'month') renderMonth();
        }

        function updatePeriodLabel() {
            const label = document.getElementById('periodLabel');
            if (currentView === 'month') {
                const { first } = getMonthRange(periodOffset);
                label.textContent = first.toLocaleDateString('ru-RU', { month: 'long', year: 'numeric' });
            } else {
                const { monday, sunday } = getWeekRange(periodOffset);
                label.textContent = `${formatDate(monday)} – ${formatDate(sunday)}`;
            }
        }

        function renderFilters() {
            const container = document.getElementById('filtersContainer');
            if (data.members.length === 0) {
                container.innerHTML = '<span style="color:var(--text-secondary); font-size:14px;">Добавьте участников в настройках</span>';
                return;
            }
            let html = '';
            data.members.forEach(m => {
                const checked = filterState[m.id] !== false;
                html += `
                    <label class="filter-item">
                        <input type="checkbox" data-participant="${m.id}" ${checked ? 'checked' : ''} onchange="toggleFilter('${m.id}')" />
                        <span class="color-dot" style="background:${m.color}"></span>
                        ${m.name}
                    </label>
                `;
            });
            container.innerHTML = html;
        }

        function toggleFilter(id) {
            filterState[id] = !filterState[id];
            render();
        }

        function isFilteredOut(participantId) {
            return filterState[participantId] === false;
        }

        // ----- СПИСОК -----
        function renderList() {
            const container = document.getElementById('weekContainer');
            const days = getWeekDays(periodOffset);
            const eventsByDay = days.map(d => getEventsForDate(d));
            let html = '';
            days.forEach((date, index) => {
                const dayEvents = eventsByDay[index]
                    .filter(ev => !isFilteredOut(ev.participantId))
                    .sort((a,b) => new Date(a.start) - new Date(b.start));
                html += `<div class="day-list">`;
                html += `<div class="day-header">${getDayName(index)} <span class="date">${formatDate(date)}</span></div>`;
                if (dayEvents.length === 0) {
                    html += `<div class="empty-day">Нет событий</div>`;
                } else {
                    dayEvents.forEach(ev => {
                        const participant = getMember(ev.participantId);
                        const color = participant ? participant.color : '#94a3b8';
                        const name = participant ? participant.name : 'Без участника';
                        const start = new Date(ev.start);
                        const end = new Date(ev.end);
                        const timeStr = formatTime(start) + ' – ' + formatTime(end);
                        html += `
                            <div class="event-item">
                                <span class="event-time">${timeStr}</span>
                                <span class="event-name">${ev.name}</span>
                                <span class="event-participant">
                                    <span class="dot" style="background:${color}"></span>
                                    ${name}
                                </span>
                                <div class="event-actions">
                                    <button onclick="editEvent('${ev.id}')" title="Редактировать">✎</button>
                                    <button class="delete-event" onclick="deleteEvent('${ev.id}')" title="Удалить">✕</button>
                                </div>
                            </div>
                        `;
                    });
                }
                html += `</div>`;
            });
            container.innerHTML = html;
            initSwipe('list');
        }

        function getDayName(index) {
            return ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'][index];
        }

        // ----- НЕДЕЛЬНАЯ СЕТКА (исправлена прокрутка) -----
        function renderGrid() {
            const container = document.getElementById('weekContainer');
            const days = getWeekDays(periodOffset);
            const eventsByDay = days.map(d => getEventsForDate(d));
            const hourHeight = window.innerWidth <= 480 ? 24 : 32;
            const totalHeight = 24 * hourHeight;

            let html = `<div class="grid-wrapper"><div class="grid-scroll" id="gridScroll">`;
            days.forEach((date, index) => {
                const dayEvents = eventsByDay[index]
                    .filter(ev => !isFilteredOut(ev.participantId))
                    .sort((a,b) => new Date(a.start) - new Date(b.start));

                const hourColors = new Array(24).fill(null).map(() => []);
                for (let h = 0; h < 24; h++) {
                    const hourStart = h, hourEnd = h + 1;
                    const eventsInHour = dayEvents.filter(ev => {
                        const s = new Date(ev.start);
                        const e = new Date(ev.end);
                        const sHour = s.getHours() + s.getMinutes() / 60;
                        const eHour = e.getHours() + e.getMinutes() / 60;
                        return intervalsOverlap(sHour, eHour, hourStart, hourEnd);
                    });
                    const colors = new Set();
                    eventsInHour.forEach(ev => {
                        const color = getMemberColor(ev.participantId);
                        if (color) colors.add(color);
                    });
                    hourColors[h] = Array.from(colors);
                }

                html += `<div class="grid-day" data-day-index="${index}">`;
                html += `<div class="grid-day-header">${getDayName(index)}<br><span class="date">${formatDate(date)}</span></div>`;
                html += `<div class="grid-timeline" style="height:${totalHeight}px;" data-date="${date.toISOString().slice(0,10)}">`;

                for (let h = 0; h < 24; h++) {
                    const top = h * hourHeight;
                    const colors = hourColors[h];
                    const hasOverlap = colors.length > 1;
                    if (hasOverlap) {
                        let gradient = '';
                        if (colors.length === 2) {
                            gradient = `linear-gradient(45deg, ${colors[0]} 50%, ${colors[1]} 50%)`;
                        } else {
                            const parts = colors.map((c, i) => `${c} ${(i/colors.length)*100}%, ${c} ${((i+1)/colors.length)*100}%`).join(', ');
                            gradient = `repeating-linear-gradient(45deg, ${parts})`;
                        }
                        html += `<div class="grid-hour-overlay" style="top:${top}px; height:${hourHeight}px; background:${gradient};"></div>`;
                    }
                    let hasRealConflict = false;
                    if (colors.length > 1) {
                        const eventsInHour = dayEvents.filter(ev => {
                            const s = new Date(ev.start);
                            const e = new Date(ev.end);
                            const sHour = s.getHours() + s.getMinutes() / 60;
                            const eHour = e.getHours() + e.getMinutes() / 60;
                            return intervalsOverlap(sHour, eHour, h, h+1);
                        });
                        const hasUnresolved = eventsInHour.some(ev => !ev.allowOverlap);
                        if (hasUnresolved) hasRealConflict = true;
                    }
                    const conflictClass = hasRealConflict ? ' conflict' : '';
                    html += `<div class="grid-hour${conflictClass}" style="top:${top}px; height:${hourHeight}px;">${h}:00${hasRealConflict ? ' ⚠️' : ''}</div>`;
                }

                // События
                const sortedEvents = [...dayEvents].sort((a,b) => {
                    const aStart = new Date(a.start).getTime();
                    const bStart = new Date(b.start).getTime();
                    if (aStart !== bStart) return aStart - bStart;
                    return new Date(a.end).getTime() - new Date(b.end).getTime();
                });

                sortedEvents.forEach((ev) => {
                    const start = new Date(ev.start);
                    const end = new Date(ev.end);
                    const startHour = start.getHours() + start.getMinutes() / 60;
                    const endHour = end.getHours() + end.getMinutes() / 60;
                    const duration = endHour - startHour;
                    if (duration <= 0) return;
                    const top = startHour * hourHeight;
                    const height = duration * hourHeight;
                    const color = getMemberColor(ev.participantId);
                    const name = getMemberName(ev.participantId);
                    const isConflict = hasConflict(ev, dayEvents);
                    const conflictClass = isConflict ? ' conflict' : '';
                    const badge = isConflict ? '<span class="conflict-badge">⚠️</span>' : '';

                    let isOverlap = false;
                    for (let other of sortedEvents) {
                        if (other.id === ev.id) continue;
                        if (!other.allowOverlap || !ev.allowOverlap) continue;
                        const oStart = new Date(other.start);
                        const oEnd = new Date(other.end);
                        if (intervalsOverlap(start.getTime(), end.getTime(), oStart.getTime(), oEnd.getTime())) {
                            isOverlap = true;
                            break;
                        }
                    }
                    const opacityStyle = isOverlap ? ' opacity:0.7;' : '';

                    html += `
                        <div class="grid-event-block${conflictClass}" style="top:${top}px; height:${height}px; background:${color};${opacityStyle}"
                             data-event-id="${ev.id}"
                             onclick="editEvent('${ev.id}')">
                            ${badge}
                            <strong>${ev.name}</strong>
                            <span class="time">${formatTime(start)} – ${formatTime(end)}</span>
                            <span class="participant">${name}</span>
                        </div>
                    `;
                });

                html += `</div></div>`;
            });
            html += `</div></div>`;
            container.innerHTML = html;
            // Для сетки свайп переключения недель отключаем, но оставляем горизонтальную прокрутку
            const containerEl = document.getElementById('weekContainer');
            containerEl.removeEventListener('touchstart', onSwipeStart);
            containerEl.removeEventListener('touchmove', onSwipeMove);
            containerEl.removeEventListener('touchend', onSwipeEnd);
            // Принудительно включаем горизонтальную прокрутку
            const wrapper = document.querySelector('.grid-wrapper');
            if (wrapper) wrapper.style.overflowX = 'auto';
        }

        // ----- МЕСЯЦ (с добавленным свайпом) -----
        function renderMonth() {
            const container = document.getElementById('weekContainer');
            const { first, last } = getMonthRange(periodOffset);
            const start = new Date(first);
            start.setDate(1);
            let startDay = start.getDay();
            const offset = (startDay === 0 ? 6 : startDay - 1);
            start.setDate(start.getDate() - offset);

            const end = new Date(last);
            const totalDays = Math.ceil((end - start) / (24*60*60*1000)) + 1;

            let html = `<div class="month-grid">`;
            html += `<div class="month-header"><span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span></div>`;
            html += `<div class="month-days">`;

            const today = dateOnly(new Date());

            for (let i = 0; i < totalDays; i++) {
                const date = new Date(start);
                date.setDate(start.getDate() + i);
                const isCurrentMonth = date.getMonth() === first.getMonth() && date.getFullYear() === first.getFullYear();
                const isToday = dateOnly(date).getTime() === today.getTime();
                const events = getEventsForDate(date).filter(ev => !isFilteredOut(ev.participantId));
                const colors = new Set();
                events.forEach(ev => {
                    const color = getMemberColor(ev.participantId);
                    if (color) colors.add(color);
                });

                html += `<div class="month-day${isCurrentMonth ? '' : ' other-month'}${isToday ? ' today' : ''}" onclick="showDayEvents('${date.toISOString()}')">`;
                html += `<div class="day-number">${date.getDate()}</div>`;
                if (colors.size > 0) {
                    html += `<div class="day-dots">`;
                    colors.forEach(c => {
                        html += `<span class="dot" style="background:${c};"></span>`;
                    });
                    html += `</div>`;
                }
                html += `</div>`;
            }

            html += `</div></div>`;
            container.innerHTML = html;
            // Включаем свайп для месяца
            initSwipe('month');
        }

        // ---- Просмотр дня в месяце ----
        function showDayEvents(dateStr) {
            const date = new Date(dateStr);
            if (isNaN(date.getTime())) {
                alert('Ошибка даты');
                return;
            }
            const events = getEventsForDate(date).filter(ev => !isFilteredOut(ev.participantId));
            document.getElementById('dayEventsTitle').textContent = `События ${formatDateFull(date)}`;
            const list = document.getElementById('dayEventsList');
            if (events.length === 0) {
                list.innerHTML = '<p style="color:var(--text-secondary);">Нет событий</p>';
            } else {
                let html = '';
                events.sort((a,b) => new Date(a.start) - new Date(b.start)).forEach(ev => {
                    const participant = getMember(ev.participantId);
                    const color = participant ? participant.color : '#94a3b8';
                    const name = participant ? participant.name : 'Без участника';
                    const start = new Date(ev.start);
                    const end = new Date(ev.end);
                    html += `
                        <div class="event-item" style="border-bottom:1px solid var(--border); padding:6px 0;">
                            <span class="event-time" style="min-width:70px;">${formatTime(start)} – ${formatTime(end)}</span>
                            <span class="event-name">${ev.name}</span>
                            <span class="event-participant"><span class="dot" style="background:${color};"></span> ${name}</span>
                            <div class="event-actions">
                                <button onclick="editEvent('${ev.id}'); closeDayEvents();" title="Редактировать">✎</button>
                                <button class="delete-event" onclick="deleteEvent('${ev.id}'); closeDayEvents();" title="Удалить">✕</button>
                            </div>
                        </div>
                    `;
                });
                list.innerHTML = html;
            }
            openModal('dayEventsModal');
        }

        function closeDayEvents() { closeModal('dayEventsModal'); }

        // ============================================================
        //  СВАЙП (для списка и месяца)
        // ============================================================
        let swipeStartX = 0, swipeStartY = 0, isSwiping = false;
        let swipeTarget = 'list'; // 'list' или 'month'

        function initSwipe(mode) {
            const container = document.getElementById('weekContainer');
            // Удаляем старые обработчики
            container.removeEventListener('touchstart', onSwipeStart);
            container.removeEventListener('touchmove', onSwipeMove);
            container.removeEventListener('touchend', onSwipeEnd);
            // Включаем только для списка или месяца
            if (mode === 'list' || mode === 'month') {
                swipeTarget = mode;
                container.addEventListener('touchstart', onSwipeStart, { passive: false });
                container.addEventListener('touchmove', onSwipeMove, { passive: false });
                container.addEventListener('touchend', onSwipeEnd, { passive: false });
            }
        }

        function onSwipeStart(e) {
            const touch = e.touches[0];
            swipeStartX = touch.clientX;
            swipeStartY = touch.clientY;
            isSwiping = false;
        }
        function onSwipeMove(e) {
            if (e.touches.length !== 1) return;
            const touch = e.touches[0];
            const dx = touch.clientX - swipeStartX;
            const dy = touch.clientY - swipeStartY;
            if (Math.abs(dx) > 30 && Math.abs(dx) > Math.abs(dy) * 1.2) {
                e.preventDefault();
                isSwiping = true;
            }
        }
        function onSwipeEnd(e) {
            if (!isSwiping) return;
            const touch = e.changedTouches[0];
            const dx = touch.clientX - swipeStartX;
            if (Math.abs(dx) > 50) {
                if (dx < 0) changePeriod(1);
                else changePeriod(-1);
            }
            isSwiping = false;
        }

        // ============================================================
        //  НАВИГАЦИЯ
        // ============================================================
        function changePeriod(delta) {
            periodOffset += delta;
            render();
        }

        // ============================================================
        //  ПАРСЕР ТЕКСТОВОГО ВВОДА
        // ============================================================
        function parseAndFillEvent() {
            const text = document.getElementById('eventTextInput').value.trim();
            if (!text) {
                alert('Введите описание события');
                return;
            }

            let parsed = parseEventText(text);
            if (!parsed) {
                alert('Не удалось распознать описание. Попробуйте изменить фразу.\nПример: "Ужин с Аней завтра в 19:00"');
                return;
            }

            if (parsed.name) document.getElementById('eventName').value = parsed.name;
            if (parsed.start) document.getElementById('eventStart').value = parsed.start;
            if (parsed.end) document.getElementById('eventEnd').value = parsed.end;
            if (parsed.participantId) {
                document.getElementById('eventParticipant').value = parsed.participantId;
            } else if (parsed.participantName) {
                const members = data.members;
                let found = members.find(m => m.name.toLowerCase() === parsed.participantName.toLowerCase());
                if (found) {
                    document.getElementById('eventParticipant').value = found.id;
                }
            }

            switchEventMode('manual');
            alert('Событие распознано! Проверьте и сохраните.');
        }

        function parseEventText(text) {
            text = text.replace(/\s+/g, ' ').trim();
            let result = { name: '', start: null, end: null, participantId: null, participantName: '' };

            let timeMatch = null;
            let timeRegex = /(?:в\s*)?(\d{1,2}):(\d{2})\s*(?:[уа])?/i;
            let match = text.match(timeRegex);
            if (match) {
                let hours = parseInt(match[1]);
                let minutes = parseInt(match[2]);
                if (hours < 24 && minutes < 60) {
                    timeMatch = { hours, minutes };
                    text = text.replace(match[0], '').trim();
                }
            } else {
                let eveningMatch = text.match(/в\s*(\d{1,2})\s*вечера/i);
                if (eveningMatch) {
                    let h = parseInt(eveningMatch[1]);
                    if (h >= 1 && h <= 12) h += 12;
                    if (h < 24) {
                        timeMatch = { hours: h, minutes: 0 };
                        text = text.replace(eveningMatch[0], '').trim();
                    }
                } else {
                    let morningMatch = text.match(/в\s*(\d{1,2})\s*утра/i);
                    if (morningMatch) {
                        let h = parseInt(morningMatch[1]);
                        if (h < 24) {
                            timeMatch = { hours: h, minutes: 0 };
                            text = text.replace(morningMatch[0], '').trim();
                        }
                    }
                }
            }

            let dateObj = null;
            let dateRegex = /(сегодня|завтра|послезавтра)/i;
            let dateMatch = text.match(dateRegex);
            if (dateMatch) {
                let keyword = dateMatch[0].toLowerCase();
                let now = new Date();
                let target = new Date(now);
                if (keyword === 'сегодня') { /* остаётся */ }
                else if (keyword === 'завтра') { target.setDate(now.getDate() + 1); }
                else if (keyword === 'послезавтра') { target.setDate(now.getDate() + 2); }
                dateObj = target;
                text = text.replace(dateMatch[0], '').trim();
            } else {
                let days = ['понедельник','вторник','среда','четверг','пятница','суббота','воскресенье'];
                let dayRegex = new RegExp('(?:в\\s*)?(' + days.join('|') + ')', 'i');
                let dayMatch = text.match(dayRegex);
                if (dayMatch) {
                    let dayName = dayMatch[1].toLowerCase();
                    let now = new Date();
                    let target = new Date(now);
                    let dayIndex = days.indexOf(dayName);
                    let currentDay = now.getDay();
                    let targetDay = (dayIndex === 0 ? 1 : dayIndex + 1);
                    let diff = targetDay - currentDay;
                    if (diff < 0) diff += 7;
                    if (diff === 0 && now.getHours() >= 12) diff = 7;
                    target.setDate(now.getDate() + diff);
                    dateObj = target;
                    text = text.replace(dayMatch[0], '').trim();
                } else {
                    let dateNumRegex = /(\d{1,2})\s*(?:мая|июня|июля|августа|сентября|октября|ноября|декабря|января|февраля|марта|апреля)/i;
                    let dateNumMatch = text.match(dateNumRegex);
                    if (dateNumMatch) {
                        let day = parseInt(dateNumMatch[1]);
                        let monthNames = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
                        let monthStr = dateNumMatch[2].toLowerCase();
                        let monthIndex = monthNames.indexOf(monthStr);
                        if (monthIndex !== -1) {
                            let now = new Date();
                            let year = now.getFullYear();
                            let target = new Date(year, monthIndex, day);
                            if (target < now) {
                                target.setFullYear(year + 1);
                            }
                            dateObj = target;
                            text = text.replace(dateNumMatch[0], '').trim();
                        }
                    } else {
                        let dotMatch = text.match(/(\d{1,2})[\/\.](\d{1,2})/);
                        if (dotMatch) {
                            let day = parseInt(dotMatch[1]);
                            let month = parseInt(dotMatch[2]) - 1;
                            let now = new Date();
                            let year = now.getFullYear();
                            let target = new Date(year, month, day);
                            if (target < now) {
                                target.setFullYear(year + 1);
                            }
                            dateObj = target;
                            text = text.replace(dotMatch[0], '').trim();
                        }
                    }
                }
            }

            let participantName = '';
            let participantMatch = text.match(/(?:с|со)\s+([А-Яа-яЁё]+)/i);
            if (participantMatch) {
                participantName = participantMatch[1];
                text = text.replace(participantMatch[0], '').trim();
            }

            let name = text.trim();
            if (!name) name = 'Событие';

            let now = new Date();
            let startDate = dateObj ? new Date(dateObj) : new Date(now);
            if (timeMatch) {
                startDate.setHours(timeMatch.hours, timeMatch.minutes, 0, 0);
            } else {
                startDate.setHours(now.getHours() + 1, 0, 0, 0);
            }
            let endDate = new Date(startDate);
            endDate.setHours(startDate.getHours() + 1);

            result.name = name;
            result.start = toLocalDatetime(startDate);
            result.end = toLocalDatetime(endDate);
            result.participantName = participantName;

            return result;
        }

        // ============================================================
        //  РЕЖИМЫ ВВОДА
        // ============================================================
        function switchEventMode(mode) {
            currentEventMode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.mode === mode);
            });
            document.getElementById('manualFields').style.display = (mode === 'manual') ? 'block' : 'none';
            document.getElementById('textFields').style.display = (mode === 'text') ? 'block' : 'none';
        }

        // ============================================================
        //  СОБЫТИЯ (CRUD)
        // ============================================================
        function openAddEvent() {
            document.getElementById('eventModalTitle').textContent = '➕ Новое событие';
            document.getElementById('editingEventId').value = '';
            document.getElementById('saveEventBtn').textContent = 'Сохранить';
            document.getElementById('eventName').value = '';
            document.getElementById('eventNotes').value = '';
            document.getElementById('eventTextInput').value = '';
            const now = new Date();
            document.getElementById('eventStart').value = toLocalDatetime(now);
            const end = new Date(now);
            end.setHours(now.getHours() + 1);
            document.getElementById('eventEnd').value = toLocalDatetime(end);
            document.getElementById('recurrenceType').value = 'none';
            document.getElementById('recurrenceInterval').value = 1;
            document.getElementById('recurrenceUntil').value = '';
            document.getElementById('allowOverlap').checked = false;
            populateParticipantSelect();
            switchEventMode('manual');
            openModal('eventModal');
        }

        function editEvent(eventId) {
            const ev = data.events.find(e => e.id === eventId);
            if (!ev) return;
            document.getElementById('eventModalTitle').textContent = '✎ Редактировать событие';
            document.getElementById('editingEventId').value = eventId;
            document.getElementById('saveEventBtn').textContent = 'Обновить';
            document.getElementById('eventTextInput').value = '';

            const start = new Date(ev.start);
            const end = new Date(ev.end);
            document.getElementById('eventName').value = ev.name;
            document.getElementById('eventNotes').value = ev.notes || '';
            document.getElementById('allowOverlap').checked = ev.allowOverlap || false;
            document.getElementById('eventStart').value = toLocalDatetime(start);
            document.getElementById('eventEnd').value = toLocalDatetime(end);

            if (ev.recurrence) {
                document.getElementById('recurrenceType').value = ev.recurrence.type;
                document.getElementById('recurrenceInterval').value = ev.recurrence.interval || 1;
                document.getElementById('recurrenceUntil').value = ev.recurrence.until ? new Date(ev.recurrence.until).toISOString().slice(0, 10) : '';
            } else {
                document.getElementById('recurrenceType').value = 'none';
                document.getElementById('recurrenceInterval').value = 1;
                document.getElementById('recurrenceUntil').value = '';
            }
            populateParticipantSelect();
            document.getElementById('eventParticipant').value = ev.participantId;
            switchEventMode('manual');
            openModal('eventModal');
        }

        function populateParticipantSelect() {
            const select = document.getElementById('eventParticipant');
            select.innerHTML = '';
            if (data.members.length === 0) {
                select.innerHTML = '<option value="">Сначала добавьте участников</option>';
            } else {
                data.members.forEach(m => {
                    const opt = document.createElement('option');
                    opt.value = m.id;
                    opt.textContent = m.name;
                    select.appendChild(opt);
                });
            }
        }

        function saveEvent() {
            const id = document.getElementById('editingEventId').value;
            const name = document.getElementById('eventName').value.trim();
            let start = document.getElementById('eventStart').value;
            let end = document.getElementById('eventEnd').value;
            const participantId = document.getElementById('eventParticipant').value;
            const recType = document.getElementById('recurrenceType').value;
            const recInterval = parseInt(document.getElementById('recurrenceInterval').value) || 1;
            const recUntil = document.getElementById('recurrenceUntil').value;
            const allowOverlap = document.getElementById('allowOverlap').checked;
            const notes = document.getElementById('eventNotes').value.trim();

            if (!name || !start || !end || !participantId) {
                alert('Заполните все поля!');
                return;
            }
            if (new Date(start) >= new Date(end)) {
                alert('Время окончания должно быть позже времени начала.');
                return;
            }

            const recurrence = { type: recType, interval: recInterval, until: recUntil || null };

            let eventObj;
            if (id) {
                const ev = data.events.find(e => e.id === id);
                if (!ev) return;
                ev.name = name; ev.start = start; ev.end = end;
                ev.participantId = participantId; ev.recurrence = recurrence;
                ev.allowOverlap = allowOverlap; ev.notes = notes;
                eventObj = ev;
            } else {
                eventObj = { id: generateId(), name, start, end, participantId, recurrence, allowOverlap, notes };
            }

            const others = data.events.filter(e => e.id !== eventObj.id);
            const hasConflictWithOthers = hasConflict(eventObj, others);
            if (hasConflictWithOthers && !eventObj.allowOverlap) {
                pendingEvent = eventObj;
                document.getElementById('conflictMessage').textContent =
                    `Событие "${eventObj.name}" пересекается с другими событиями. Вы можете принять конфликт (тогда оно будет отображаться без предупреждений) или изменить время.`;
                openModal('conflictModal');
                return;
            }

            if (id) { /* уже обновили */ } else { data.events.push(eventObj); }
            saveData();
            closeModal('eventModal');
            render();
        }

        function acceptConflict() {
            if (pendingEvent) {
                pendingEvent.allowOverlap = true;
                if (!data.events.find(e => e.id === pendingEvent.id)) {
                    data.events.push(pendingEvent);
                }
                saveData();
                closeModal('conflictModal');
                pendingEvent = null;
                closeModal('eventModal');
                render();
            }
        }
        function rejectConflict() { closeModal('conflictModal'); pendingEvent = null; }

        function deleteEvent(id) {
            if (!confirm('Удалить событие?')) return;
            data.events = data.events.filter(e => e.id !== id);
            saveData();
            render();
        }

        // ============================================================
        //  НАСТРОЙКИ СЕМЬИ
        // ============================================================
        let selectedColor = COLORS[0];
        function openSettings() {
            openModal('settingsModal');
            renderMembers();
            renderColorOptions();
        }
        function closeSettings() { closeModal('settingsModal'); }

        function renderMembers() {
            const container = document.getElementById('memberList');
            if (data.members.length === 0) {
                container.innerHTML = '<p style="color:var(--text-secondary);">Пока нет участников. Добавьте первого!</p>';
                return;
            }
            let html = '';
            data.members.forEach(m => {
                html += `
                    <div class="member-row">
                        <span class="color-dot" style="background:${m.color}"></span>
                        <span>${m.name}</span>
                        <button onclick="removeMember('${m.id}')">✕</button>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function renderColorOptions() {
            const container = document.getElementById('colorSelect');
            container.innerHTML = '';
            COLORS.forEach(c => {
                const div = document.createElement('div');
                div.className = 'color-option' + (c === selectedColor ? ' selected' : '');
                div.style.background = c;
                div.dataset.color = c;
                div.onclick = function() {
                    document.querySelectorAll('.color-option').forEach(el => el.classList.remove('selected'));
                    this.classList.add('selected');
                    selectedColor = this.dataset.color;
                };
                container.appendChild(div);
            });
        }

        function addMember() {
            const input = document.getElementById('newMemberName');
            const name = input.value.trim();
            if (!name) { alert('Введите имя'); return; }
            if (data.members.some(m => m.name.toLowerCase() === name.toLowerCase())) {
                alert('Участник с таким именем уже есть');
                return;
            }
            data.members.push({ id: generateId(), name, color: selectedColor });
            saveData();
            input.value = '';
            selectedColor = COLORS[0];
            renderColorOptions();
            renderMembers();
            filterState[data.members[data.members.length-1].id] = true;
            render();
        }

        function removeMember(id) {
            if (!confirm('Удалить участника?')) return;
            data.members = data.members.filter(m => m.id !== id);
            delete filterState[id];
            saveData();
            renderMembers();
            render();
        }

        // ============================================================
        //  АНАЛИТИКА
        // ============================================================
        function openAnalytics() {
            const select = document.getElementById('analyticsParticipant');
            select.innerHTML = '<option value="all">Все</option>';
            data.members.forEach(m => {
                const opt = document.createElement('option');
                opt.value = m.id;
                opt.textContent = m.name;
                select.appendChild(opt);
            });
            const end = new Date();
            const start = new Date();
            start.setDate(start.getDate() - 30);
            document.getElementById('analyticsStart').value = start.toISOString().slice(0,10);
            document.getElementById('analyticsEnd').value = end.toISOString().slice(0,10);
            document.getElementById('analyticsResult').innerHTML = '';
            const canvas = document.getElementById('analyticsChart');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            openModal('analyticsModal');
        }

        function closeAnalytics() { closeModal('analyticsModal'); }

        function showAnalytics() {
            const startStr = document.getElementById('analyticsStart').value;
            const endStr = document.getElementById('analyticsEnd').value;
            const participantId = document.getElementById('analyticsParticipant').value;
            if (!startStr || !endStr) {
                alert('Выберите период');
                return;
            }
            const start = new Date(startStr);
            const end = new Date(endStr);
            end.setHours(23,59,59,999);
            if (start > end) {
                alert('Дата начала не может быть позже даты окончания');
                return;
            }

            let events = getEventsForPeriod(start, end);
            if (participantId !== 'all') {
                events = events.filter(ev => ev.participantId === participantId);
            }
            const groups = {};
            events.forEach(ev => {
                const key = ev.name;
                if (!groups[key]) groups[key] = 0;
                const duration = (new Date(ev.end) - new Date(ev.start)) / (1000 * 60 * 60);
                groups[key] += duration;
            });

            const resultDiv = document.getElementById('analyticsResult');
            if (Object.keys(groups).length === 0) {
                resultDiv.innerHTML = '<p style="color:var(--text-secondary);">Нет данных за выбранный период</p>';
                const canvas = document.getElementById('analyticsChart');
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                return;
            }

            const sorted = Object.entries(groups).sort((a,b) => b[1] - a[1]);
            let tableHtml = `<table class="analytics-table"><tr><th>Событие</th><th>Время</th></tr>`;
            sorted.forEach(([name, hours]) => {
                const h = Math.floor(hours);
                const m = Math.round((hours - h) * 60);
                tableHtml += `<tr><td>${name}</td><td>${h} ч ${m} мин</td></tr>`;
            });
            tableHtml += `</table>`;
            resultDiv.innerHTML = tableHtml;
            drawPieChart(sorted);
        }

        function drawPieChart(data) {
            const canvas = document.getElementById('analyticsChart');
            const ctx = canvas.getContext('2d');
            const width = canvas.width;
            const height = canvas.height;
            ctx.clearRect(0, 0, width, height);

            const total = data.reduce((sum, [, val]) => sum + val, 0);
            if (total === 0) return;

            const centerX = width / 2;
            const centerY = height / 2;
            const radius = Math.min(width, height) / 2 - 20;
            let startAngle = -Math.PI / 2;

            data.forEach(([name, value], index) => {
                const sliceAngle = (value / total) * 2 * Math.PI;
                const color = COLORS[index % COLORS.length];

                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, startAngle, startAngle + sliceAngle);
                ctx.closePath();
                ctx.fillStyle = color;
                ctx.fill();
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 2;
                ctx.stroke();

                const midAngle = startAngle + sliceAngle / 2;
                const labelRadius = radius * 0.65;
                const labelX = centerX + Math.cos(midAngle) * labelRadius;
                const labelY = centerY + Math.sin(midAngle) * labelRadius;
                const percent = ((value / total) * 100).toFixed(1);
                ctx.fillStyle = 'white';
                ctx.font = 'bold 12px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(percent + '%', labelX, labelY);

                startAngle += sliceAngle;
            });

            let legendY = height - 10;
            let legendX = 10;
            ctx.font = '11px sans-serif';
            data.forEach(([name], index) => {
                const color = COLORS[index % COLORS.length];
                ctx.fillStyle = color;
                ctx.fillRect(legendX, legendY, 12, 12);
                ctx.fillStyle = 'var(--text)';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'middle';
                ctx.fillText(name, legendX + 16, legendY + 6);
                legendX += ctx.measureText(name).width + 30;
                if (legendX > width - 20) {
                    legendX = 10;
                    legendY += 20;
                }
            });
        }

        // ============================================================
        //  МОДАЛКИ (общие)
        // ============================================================
        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }
        function closeEvent() { closeModal('eventModal'); }

        // ============================================================
        //  ТЕМА
        // ============================================================
        function applyTheme(theme) {
            const body = document.body;
            if (theme === 'dark') {
                body.classList.add('dark');
                document.querySelector('.theme-toggle').textContent = '☀️';
            } else if (theme === 'light') {
                body.classList.remove('dark');
                document.querySelector('.theme-toggle').textContent = '🌙';
            } else {
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (prefersDark) {
                    body.classList.add('dark');
                    document.querySelector('.theme-toggle').textContent = '☀️';
                } else {
                    body.classList.remove('dark');
                    document.querySelector('.theme-toggle').textContent = '🌙';
                }
            }
            currentTheme = theme;
            localStorage.setItem('themePreference', theme);
        }
        function toggleTheme() {
            if (currentTheme === 'light') applyTheme('dark');
            else if (currentTheme === 'dark') applyTheme('light');
            else {
                const isDark = document.body.classList.contains('dark');
                applyTheme(isDark ? 'light' : 'dark');
            }
        }
        function initTheme() {
            const saved = localStorage.getItem('themePreference');
            if (saved) applyTheme(saved);
            else applyTheme('auto');
            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
                if (currentTheme === 'auto') applyTheme('auto');
            });
        }

        // ============================================================
        //  ПЕРЕКЛЮЧЕНИЕ РЕЖИМОВ ОТОБРАЖЕНИЯ
        // ============================================================
        function setView(view) {
            currentView = view;
            document.querySelectorAll('.view-switch button').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.view === view);
            });
            render();
        }

        // ============================================================
        //  ИНИЦИАЛИЗАЦИЯ
        // ============================================================
        initTheme();
        render();
    </script>
